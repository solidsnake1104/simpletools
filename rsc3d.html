<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irondale – Classic Browser RPG (RS2-Inspired)</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Segoe UI',monospace;user-select:none;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;}
#game-wrapper{position:relative;width:765px;height:503px;background:#000;border:2px solid #3a2a1a;}
#game-canvas{display:block;width:765px;height:503px;}
#hud{position:absolute;top:0;left:0;width:765px;height:503px;pointer-events:none;overflow:hidden;}
#loading-screen{position:absolute;inset:0;background:#0a0500;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-spinner { width:32px;height:32px;border:3px solid #3a2a1a;border-top-color:#c5a028;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px; }
#loading-screen h1{color:#c5a028;font-family:Georgia,serif;font-size:48px;text-shadow:0 0 20px #c5a028,0 0 40px #8a6a10;letter-spacing:4px;}
#loading-screen .sub{color:#8a6a3a;font-size:14px;margin:8px 0 24px;font-style:italic;}
#load-bar-outer{width:300px;height:20px;border:1px solid #5a4a2a;background:#0a0500;border-radius:2px;}
#load-bar{height:100%;background:linear-gradient(90deg,#8a6a10,#c5a028);width:0%;transition:width 0.3s;border-radius:1px;}
#load-status{color:#8a6a3a;font-size:12px;margin-top:8px;}
#top-bar{position:absolute;top:0;left:0;right:160px;height:24px;background:rgba(0,0,0,0.8);border-bottom:1px solid #3a2a1a;display:flex;align-items:center;padding:0 8px;gap:12px;font-size:11px;font-family:monospace;pointer-events:auto;color:#ff981f;z-index:10;}
#top-bar .title{color:#c5a028;font-weight:bold;letter-spacing:1px;}
#top-bar span{color:#aaa;}
#top-bar .val{color:#fff;}
#minimap-wrap{position:absolute;top:0;right:0;width:160px;height:160px;background:#0a0a05;border:2px solid #5a4a2a;border-top:none;border-right:none;pointer-events:auto;cursor:crosshair;z-index:10;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#minimap{width:152px;height:152px;border-radius:0;}
.data-orb{position:absolute;left:3px;width:52px;height:52px;border-radius:50%;border:2px solid #5a4a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-family:monospace;font-weight:bold;cursor:pointer;pointer-events:auto;z-index:10;}
#hp-orb{top:160px;background:radial-gradient(circle,#4a0000 0%,#1a0000 100%);color:#ff4444;}
#prayer-orb{top:216px;background:radial-gradient(circle,#001a4a 0%,#000a1a 100%);color:#44aaff;}
#run-orb{top:272px;background:radial-gradient(circle,#1a3a00 0%,#0a1a00 100%);color:#88ff44;}
.orb-icon{font-size:14px;line-height:1;}
.orb-val{font-size:10px;line-height:1;}
#chatbox{position:absolute;bottom:0;left:0;width:519px;height:142px;background:rgba(0,0,0,0.88);border-top:1px solid #3a2a1a;display:flex;flex-direction:column;pointer-events:auto;z-index:10;}
#chat-tabs{display:flex;height:20px;background:#0a0500;border-bottom:1px solid #3a2a1a;flex-shrink:0;}
.chat-tab{flex:1;background:#1a0f05;color:#ff981f;font-size:10px;cursor:pointer;border-right:1px solid #3a2a1a;text-align:center;padding-top:3px;font-family:monospace;}
.chat-tab.active{background:#2a1a0a;color:#fff;}
#chat-messages{flex:1;overflow-y:auto;padding:2px 4px;font-size:11px;font-family:monospace;scrollbar-width:thin;scrollbar-color:#3a2a1a #0a0500;}
#chat-messages::-webkit-scrollbar{width:6px;}
#chat-messages::-webkit-scrollbar-track{background:#0a0500;}
#chat-messages::-webkit-scrollbar-thumb{background:#3a2a1a;}
.chat-msg{padding:1px 0;line-height:1.3;}
.chat-game{color:#ff981f;}.chat-player{color:#00ffff;}.chat-quest{color:#9f4fff;}.chat-combat{color:#ff4444;}.chat-item{color:#00ff00;}.chat-skill{color:#ffff00;}
#chat-input-bar{height:22px;display:flex;background:#0a0a0a;border-top:1px solid #3a2a1a;flex-shrink:0;}
#chat-input{flex:1;background:transparent;border:none;color:#ffff00;font-size:11px;font-family:monospace;padding:0 4px;outline:none;}
#right-panel{position:absolute;right:0;bottom:0;width:196px;height:303px;background:rgba(15,10,5,0.95);border-left:1px solid #5a4a2a;border-top:1px solid #5a4a2a;display:flex;flex-direction:column;pointer-events:auto;z-index:10;}
#panel-tabs{display:flex;height:30px;background:#0a0500;border-bottom:1px solid #3a2a1a;flex-shrink:0;}
.panel-tab{flex:1;display:flex;align-items:center;justify-content:center;background:#1a0f05;color:#ff981f;font-size:13px;cursor:pointer;border-right:1px solid #2a1a0a;transition:background 0.15s;}
.panel-tab.active{background:#2a1a0a;color:#fff;}
.panel-tab:hover{background:#2a1a0a;}
#panel-content{flex:1;overflow-y:auto;padding:4px;scrollbar-width:thin;scrollbar-color:#3a2a1a #0a0500;}
#panel-content::-webkit-scrollbar{width:5px;}
#panel-content::-webkit-scrollbar-track{background:#0a0500;}
#panel-content::-webkit-scrollbar-thumb{background:#3a2a1a;}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
.inv-slot{width:44px;height:34px;background:#0a0500;border:1px solid #3a2a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:8px;color:#ff981f;text-align:center;overflow:hidden;transition:border-color 0.15s;}
.inv-slot:hover{border-color:#ff981f;}
.inv-slot .item-icon{width:32px;height:26px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;text-shadow:0 0 2px #000;font-weight:bold;}
.inv-slot .stack-count{position:absolute;bottom:1px;left:2px;font-size:8px;color:#ffff00;font-weight:bold;text-shadow:1px 1px 0 #000;}
.skill-row{display:flex;align-items:center;padding:2px 4px;font-size:10px;font-family:monospace;border-bottom:1px solid #1a1208;}
.skill-row .sk-icon{width:16px;text-align:center;margin-right:4px;}
.skill-row .sk-name{flex:1;color:#ff981f;}
.skill-row .sk-lvl{color:#fff;min-width:30px;text-align:right;}
.quest-item{padding:4px;cursor:pointer;font-size:11px;font-family:monospace;border-bottom:1px solid #1a1208;}
.quest-item .q-name{font-weight:bold;}
.q-not_started .q-name{color:#ff0000;}
.q-in_progress .q-name{color:#ffff00;}
.q-complete .q-name{color:#00ff00;}
.quest-obj{font-size:10px;color:#aaa;padding-left:12px;margin-top:2px;}
.quest-obj.done{color:#00ff00;text-decoration:line-through;}
.combat-styles{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;}
.style-btn{padding:6px;background:#1a0f05;border:1px solid #3a2a1a;color:#ff981f;font-size:10px;font-family:monospace;cursor:pointer;text-align:center;border-radius:2px;}
.style-btn.active{background:#2a1a0a;border-color:#c5a028;color:#fff;}
.style-btn:hover{border-color:#ff981f;}
.equip-grid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;}
.equip-row{display:flex;gap:2px;}
.equip-slot{width:40px;height:34px;background:#0a0500;border:1px solid #3a2a1a;display:flex;align-items:center;justify-content:center;font-size:7px;color:#555;cursor:pointer;text-align:center;}
.equip-slot.filled{color:#ff981f;border-color:#5a4a2a;}
#context-menu{position:absolute;display:none;background:#1a1208;border:1px solid #5a4a2a;min-width:130px;z-index:1000;pointer-events:auto;font-size:12px;font-family:monospace;}
.ctx-option{padding:4px 10px;color:#ff981f;cursor:pointer;}
.ctx-option:first-child{color:#ffff00;background:#0a0500;cursor:default;font-weight:bold;font-size:11px;}
.ctx-option:not(:first-child):hover{background:#2a1a0a;color:#fff;}
#dialog-panel{position:absolute;bottom:142px;left:0;width:519px;background:rgba(0,0,0,0.94);border:1px solid #5a4a2a;border-bottom:none;border-left:none;padding:10px;pointer-events:auto;display:none;z-index:20;}
#dialog-name{color:#ffff00;font-size:13px;font-weight:bold;margin-bottom:6px;font-family:monospace;}
#dialog-text{color:#fff;font-size:12px;margin-bottom:10px;line-height:1.5;font-family:monospace;}
#dialog-options{display:flex;flex-direction:column;gap:3px;}
.dialog-option{color:#00ffff;font-size:11px;cursor:pointer;padding:2px 0;font-family:monospace;}
.dialog-option:hover{color:#ffffff;}
.dialog-option::before{content:'▶ ';}
.hitsplat{position:absolute;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#fff;pointer-events:none;z-index:500;transition:all 0.8s;text-shadow:0 0 2px #000;}
.hitsplat.hit{background:#cc0000;border:1px solid #ff4444;}
.hitsplat.miss{background:#3333cc;border:1px solid #6666ff;}
.xp-drop{position:absolute;color:#ffff00;font-size:11px;font-family:monospace;pointer-events:none;font-weight:bold;text-shadow:0 0 3px #000;z-index:500;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
#bank-modal{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:none;z-index:100;pointer-events:auto;flex-direction:column;align-items:center;justify-content:center;}
#bank-inner{width:500px;background:#1a1208;border:2px solid #5a4a2a;border-radius:4px;overflow:hidden;}
#bank-header{background:#0a0500;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a2a1a;}
#bank-header span{color:#c5a028;font-size:14px;font-weight:bold;font-family:monospace;}
#bank-close{color:#ff4444;cursor:pointer;font-size:18px;font-weight:bold;}
#bank-items{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;min-height:160px;}
.bank-slot{width:54px;height:40px;background:#0a0500;border:1px solid #3a2a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:7px;color:#ff981f;text-align:center;}
.bank-slot:hover{border-color:#ff981f;}
.bank-slot .stack-count{position:absolute;bottom:1px;left:2px;font-size:8px;color:#ffff00;font-weight:bold;text-shadow:1px 1px 0 #000;}
#bank-inv{border-top:1px solid #3a2a1a;padding:8px;}
#bank-inv-label{color:#ff981f;font-size:10px;font-family:monospace;margin-bottom:4px;}
#bank-inv-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
#bank-actions{display:flex;gap:4px;padding:4px 8px 8px;justify-content:center;}
.bank-btn{padding:4px 12px;background:#2a1a0a;border:1px solid #5a4a2a;color:#ff981f;font-size:11px;font-family:monospace;cursor:pointer;border-radius:2px;}
.bank-btn:hover{background:#3a2a1a;color:#fff;}
#level-up-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #c5a028;padding:20px 30px;display:none;z-index:200;pointer-events:none;text-align:center;border-radius:4px;}
#level-up-popup h2{color:#ffff00;font-size:16px;margin-bottom:4px;font-family:monospace;}
#level-up-popup p{color:#fff;font-size:13px;font-family:monospace;}
#save-indicator{position:absolute;top:28px;left:8px;color:#3a8a3a;font-size:10px;font-family:monospace;pointer-events:none;opacity:0;transition:opacity 0.5s;z-index:10;}
#tooltip{position:absolute;display:none;background:#1a1208;border:1px solid #5a4a2a;padding:3px 6px;font-size:10px;font-family:monospace;color:#ff981f;z-index:600;pointer-events:none;white-space:nowrap;}
.hp-bar-bg{position:absolute;width:30px;height:4px;background:#300;pointer-events:none;z-index:400;border:1px solid #500;}
.hp-bar-fg{height:100%;background:#0f0;transition:width 0.2s;}
footer{position:fixed;bottom:2px;right:4px;color:#3a2a1a;font-size:9px;font-family:monospace;z-index:0;}
</style>
</head>

<script>
(function(){
"use strict";
const W=765,H=503,MAP=60,TICK_MS=600;
let tickCount=0,audioCtx=null,audioStarted=false;

// ---- ITEMS DB ----
const ITEMS={
coins:{id:'coins',name:'Coins',stackable:true,examine:'Shiny gold pieces.',value:1,color:'#ffd700'},
bones:{id:'bones',name:'Bones',stackable:false,examine:'Them old bones.',value:1,color:'#e8e8d8'},
raw_chicken:{id:'raw_chicken',name:'Raw Chicken',stackable:false,examine:'Raw chicken meat.',value:5,color:'#e8c89a'},
cooked_chicken:{id:'cooked_chicken',name:'Cooked Chicken',stackable:false,examine:'Mmm, chicken.',value:10,color:'#c87840',heals:3},
raw_beef:{id:'raw_beef',name:'Raw Beef',stackable:false,examine:'Raw beef.',value:5,color:'#c87a6a'},
cooked_meat:{id:'cooked_meat',name:'Cooked Meat',stackable:false,examine:'Nicely cooked.',value:10,color:'#8a4a2a',heals:3},
feather:{id:'feather',name:'Feather',stackable:true,examine:'A light feather.',value:1,color:'#f0f0f0'},
egg:{id:'egg',name:'Egg',stackable:false,examine:'A fresh egg.',value:5,color:'#f5e6c8'},
logs:{id:'logs',name:'Logs',stackable:false,examine:'A sturdy log.',value:5,color:'#8a6a3a'},
copper_ore:{id:'copper_ore',name:'Copper Ore',stackable:false,examine:'Copper ore.',value:5,color:'#b87a5a'},
cowhide:{id:'cowhide',name:'Cowhide',stackable:false,examine:'The hide of a cow.',value:25,color:'#c8a87a'},
raw_shrimps:{id:'raw_shrimps',name:'Raw Shrimps',stackable:false,examine:'A raw shrimp.',value:3,color:'#d4b4a4'},
cooked_shrimps:{id:'cooked_shrimps',name:'Cooked Shrimps',stackable:false,examine:'Cooked shrimps.',value:6,color:'#c88060',heals:2},
bucket_milk:{id:'bucket_milk',name:'Bucket of Milk',stackable:false,examine:'A full bucket of milk.',value:10,color:'#f0f0f8'},
pot_flour:{id:'pot_flour',name:'Pot of Flour',stackable:false,examine:'A pot of flour.',value:10,color:'#f5f0e8'},
bronze_sword:{id:'bronze_sword',name:'Bronze Sword',stackable:false,examine:'A bronze sword.',value:50,color:'#c8a068',type:'weapon',slot:'weapon',atkBonus:4,strBonus:4,defBonus:0},
iron_sword:{id:'iron_sword',name:'Iron Sword',stackable:false,examine:'An iron sword.',value:200,color:'#909090',type:'weapon',slot:'weapon',atkBonus:10,strBonus:9,defBonus:0},
iron_dagger:{id:'iron_dagger',name:'Iron Dagger',stackable:false,examine:'A sharp iron dagger.',value:100,color:'#a0a0a0',type:'weapon',slot:'weapon',atkBonus:8,strBonus:5,defBonus:0},
research_notes:{id:'research_notes',name:'Research Notes',stackable:false,examine:'Important arcane research.',value:0,color:'#f5e6c8'},
ghost_skull:{id:'ghost_skull',name:"Ghost's Skull",stackable:false,examine:'A ghostly skull.',value:0,color:'#d8d8c8'},
};

// ---- PLAYER STATE ----
const player={
tile:{x:30,y:30},pos:null,path:[],target:null,
skills:{attack:{level:1,xp:0},strength:{level:1,xp:0},defence:{level:1,xp:0},hitpoints:{level:10,xp:1154},
prayer:{level:1,xp:0},cooking:{level:1,xp:0},woodcutting:{level:1,xp:0},fishing:{level:1,xp:0},
mining:{level:1,xp:0},firemaking:{level:1,xp:0},crafting:{level:1,xp:0},smithing:{level:1,xp:0}},
currentHp:10,maxHp:10,prayer:1,maxPrayer:1,runEnergy:100,isRunning:false,
inventory:[],equipment:{head:null,body:null,legs:null,weapon:null,shield:null},
gold:25,attackStyle:'accurate',inCombat:false,combatTarget:null,attackCooldown:0,
quests:{feast_assistant:'not_started',arcane_mystery:'not_started',restless_spirit:'not_started'},
questFlags:{milkDone:false,eggDone:false,flourDone:false,notesReceived:false,notesDelivered:false,skullFound:false,skullReturned:false},
respawnTile:{x:30,y:42},deathCount:0,skillingAction:null,skillingTicks:0
};

// ---- XP SYSTEM ----
function xpForLevel(lvl){let p=0;for(let l=1;l<lvl;l++)p+=Math.floor(l+300*Math.pow(2,l/7));return Math.floor(p/4);}
function levelFromXP(xp){for(let l=98;l>=1;l--)if(xp>=xpForLevel(l+1))return l+1;return 1;}
function getTotalLevel(){let t=0;for(let s in player.skills)t+=player.skills[s].level;return t;}

// ---- MAP ----
const TILE_TYPES={GRASS:0,STONE:1,WATER:2,WALL:3,FLOOR:4,DOOR:5,SAND:6,BLOCKED:7,SWAMP:8};
const TILE_COLORS=['#4a7c3f','#7a7069','#1a4a8a','#5c4a3a','#8a7a6a','#7a5a3a','#c8b878','#3a3a3a','#2a4a2a'];
const TILE_WALK=[true,true,false,false,true,true,true,false,true];
const tileMap=new Array(MAP*MAP).fill(0);
const clipFlags=new Array(MAP*MAP).fill(0);
function tIdx(x,y){return y*MAP+x;}
function setTile(x,y,t){if(x>=0&&x<MAP&&y>=0&&y<MAP){tileMap[tIdx(x,y)]=t;clipFlags[tIdx(x,y)]=TILE_WALK[t]?0:1;}}
function getTile(x,y){if(x<0||x>=MAP||y<0||y>=MAP)return TILE_TYPES.BLOCKED;return tileMap[tIdx(x,y)];}
function isWalkable(x,y){if(x<0||x>=MAP||y<0||y>=MAP)return false;return clipFlags[tIdx(x,y)]===0;}

function buildMap(){
for(let x=0;x<MAP;x++)for(let y=0;y<MAP;y++)setTile(x,y,TILE_TYPES.GRASS);
for(let x=0;x<MAP;x++)for(let y=10;y<=12;y++)setTile(x,y,TILE_TYPES.WATER);
for(let y=10;y<=12;y++)for(let x=29;x<=31;x++)setTile(x,y,TILE_TYPES.STONE);
for(let x=24;x<=36;x++){setTile(x,22,TILE_TYPES.WALL);setTile(x,34,TILE_TYPES.WALL);}
for(let y=22;y<=34;y++){setTile(24,y,TILE_TYPES.WALL);setTile(36,y,TILE_TYPES.WALL);}
for(let x=25;x<=35;x++)for(let y=23;y<=33;y++)setTile(x,y,TILE_TYPES.STONE);
for(let x=28;x<=32;x++){setTile(x,25,TILE_TYPES.WALL);setTile(x,29,TILE_TYPES.WALL);}
for(let y=25;y<=29;y++){setTile(28,y,TILE_TYPES.WALL);setTile(32,y,TILE_TYPES.WALL);}
for(let x=29;x<=31;x++)for(let y=26;y<=28;y++)setTile(x,y,TILE_TYPES.FLOOR);
setTile(30,25,TILE_TYPES.DOOR);setTile(30,29,TILE_TYPES.DOOR);
setTile(29,34,TILE_TYPES.STONE);setTile(30,34,TILE_TYPES.STONE);setTile(31,34,TILE_TYPES.STONE);
for(let y=34;y<=55;y++){setTile(29,y,TILE_TYPES.STONE);setTile(30,y,TILE_TYPES.STONE);setTile(31,y,TILE_TYPES.STONE);}
for(let x=20;x<=40;x++){setTile(x,43,TILE_TYPES.STONE);setTile(x,44,TILE_TYPES.STONE);}
const buildings=[{x:22,y:40,w:5,h:4},{x:34,y:40,w:5,h:4},{x:23,y:46,w:4,h:4},{x:34,y:46,w:5,h:4},{x:22,y:51,w:4,h:3}];
buildings.forEach(b=>{
for(let bx=b.x;bx<b.x+b.w;bx++)for(let by=b.y;by<b.y+b.h;by++){
if(bx===b.x||bx===b.x+b.w-1||by===b.y||by===b.y+b.h-1)setTile(bx,by,TILE_TYPES.WALL);
else setTile(bx,by,TILE_TYPES.FLOOR);
}
setTile(b.x+Math.floor(b.w/2),b.y+b.h-1,TILE_TYPES.DOOR);
});
for(let x=40;x<=50;x++){setTile(x,40,TILE_TYPES.WALL);setTile(x,50,TILE_TYPES.WALL);}
for(let y=40;y<=50;y++){setTile(40,y,TILE_TYPES.WALL);setTile(50,y,TILE_TYPES.WALL);}
setTile(45,50,TILE_TYPES.DOOR);setTile(40,45,TILE_TYPES.DOOR);
for(let x=41;x<=49;x++)for(let y=41;y<=49;y++)setTile(x,y,TILE_TYPES.GRASS);
for(let x=5;x<=18;x++)for(let y=48;y<=58;y++){if(Math.random()<0.7)setTile(x,y,TILE_TYPES.SWAMP);}
for(let x=37;x<=55;x++){setTile(x,35,TILE_TYPES.SAND);setTile(x,36,TILE_TYPES.SAND);}
setTile(10,52,TILE_TYPES.SWAMP);
setTile(25,48,TILE_TYPES.STONE);
}

window.addEventListener('load', function initGame() {

// Guard: ensure Three.js loaded from CDN
if (typeof THREE === 'undefined') {
  document.getElementById('load-status').innerHTML = 'Three.js failed to load (CDN unavailable).<br><br><button id="retry-btn-cdn" style="padding:8px 20px;background:#c5a028;color:#000;border:none;cursor:pointer;font-size:14px;border-radius:3px;">↺ Retry</button>';
  var retryBtnCdn = document.getElementById('retry-btn-cdn');
  if (retryBtnCdn) retryBtnCdn.addEventListener('click', function(){ location.reload(); });
  return;
}

// ---- THREE.JS SETUP ----
const canvas=document.getElementById('game-canvas');
let renderer,scene,camera,d=18;
try{
renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x1a2a1a);
} catch(e) {
  // First failure: try again without antialias
  try {
    renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'default'});
    renderer.setSize(W,H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x1a2a1a);
  } catch(e2) {
    var ls = document.getElementById('load-status');
    ls.innerHTML = 'WebGL unavailable: ' + (e2.message||e) + '<br><br><button id="retry-btn-webgl" style="padding:8px 20px;background:#c5a028;color:#000;border:none;cursor:pointer;font-size:14px;border-radius:3px;">↺ Retry</button><br><small style="color:#888;margin-top:8px;display:block;">If this persists, try Chrome or enable hardware acceleration in browser settings.</small>';
    var retryBtnWebgl = document.getElementById('retry-btn-webgl');
    if (retryBtnWebgl) retryBtnWebgl.addEventListener('click', function(){ location.reload(); });
    return; // graceful exit — do NOT throw
  }
}

scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1a2a1a,0.012);

TILE_COLORS.forEach((c,i)=>{tileMats[i]=new THREE.MeshLambertMaterial({color:new THREE.Color(c)});});

const wallGeo=new THREE.BoxGeometry(1,1,1);
const wallMat=new THREE.MeshLambertMaterial({color:0x5c4a3a});

const dummy=new THREE.Object3D();
const typeCounts=new Array(9).fill(0);
for(let i=0;i<MAP*MAP;i++)typeCounts[tileMap[i]]++;

const instancedMeshes={};
for(let t=0;t<9;t++){
if(typeCounts[t]===0)continue;
const geo=t===TILE_TYPES.WALL?wallGeo:tileGeo;
const mat=tileMats[t];
const im=new THREE.InstancedMesh(geo,mat,typeCounts[t]);
let idx=0;
for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++){
if(tileMap[tIdx(x,y)]===t){
dummy.position.set(x,t===TILE_TYPES.WALL?0.5:0,y);
dummy.updateMatrix();
im.setMatrixAt(idx++,dummy.matrix);
}
}
im.instanceMatrix.needsUpdate=true;
im.userData.tileType=t;
scene.add(im);
instancedMeshes[t]=im;
}

const waterTiles=[];

// ---- OBJECT MESHES ----
function createTree(x,y){
const g=new THREE.Group();
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,0.8,6),new THREE.MeshLambertMaterial({color:0x5c3a1a}));
trunk.position.set(0,0.4,0);g.add(trunk);
const canopy=new THREE.Mesh(new THREE.ConeGeometry(0.55,1.2,6),new THREE.MeshLambertMaterial({color:0x2d6a2d}));
canopy.position.set(0,1.2,0);g.add(canopy);
const canopy2=new THREE.Mesh(new THREE.SphereGeometry(0.4,6,4),new THREE.MeshLambertMaterial({color:0x3a7a3a}));
canopy2.position.set(0,1.6,0);g.add(canopy2);
g.position.set(x,0,y);
return g;
}
function createRock(x,y){
const g=new THREE.Group();
const m=new THREE.Mesh(new THREE.DodecahedronGeometry(0.35,0),new THREE.MeshLambertMaterial({color:0x6a6a6a}));
m.position.set(0,0.25,0);m.rotation.set(Math.random(),Math.random(),0);g.add(m);
const m2=new THREE.Mesh(new THREE.DodecahedronGeometry(0.25,0),new THREE.MeshLambertMaterial({color:0x7a7a7a}));
m2.position.set(0.15,0.2,0.1);g.add(m2);
g.position.set(x,0,y);return g;
}
function createFishSpot(x,y){
const m=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6),new THREE.MeshLambertMaterial({color:0x44aaff,transparent:true,opacity:0.6}));
m.position.set(x,0.15,y);return m;
}
function createHumanoid(color,scale){
scale=scale||1;
const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.45,0.25),new THREE.MeshLambertMaterial({color}));
body.position.y=0.65;g.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,6),new THREE.MeshLambertMaterial({color:0xe8b89a}));
head.position.y=1.05;g.add(head);
const lArm=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.35,4),new THREE.MeshLambertMaterial({color}));
lArm.position.set(-0.25,0.6,0);g.add(lArm);
const rArm=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.35,4),new THREE.MeshLambertMaterial({color}));
rArm.position.set(0.25,0.6,0);g.add(rArm);
const lLeg=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.4,4),new THREE.MeshLambertMaterial({color:0x3a3a5a}));
lLeg.position.set(-0.1,0.2,0);g.add(lLeg);
const rLeg=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.4,4),new THREE.MeshLambertMaterial({color:0x3a3a5a}));
rLeg.position.set(0.1,0.2,0);g.add(rLeg);
g.scale.setScalar(scale);
return g;
}
function createChickenMesh(){
const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.SphereGeometry(0.2,6,5),new THREE.MeshLambertMaterial({color:0xe8e8c8}));
body.position.y=0.3;body.scale.set(1,0.8,1.2);g.add(body);

function createCowMesh(){
const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.4,0.8),new THREE.MeshLambertMaterial({color:0xd4c8b4}));

// ---- SPAWN MONSTERS ----
MONSTER_DEFS.forEach(def=>{
for(let i=0;i<def.count;i++){
const [x1,y1,x2,y2]=def.spawnArea;
let sx,sy,attempts=0;
do{sx=x1+Math.floor(Math.random()*(x2-x1));sy=y1+Math.floor(Math.random()*(y2-y1));attempts++;}while(!isWalkable(sx,sy)&&attempts<50);
let mesh;
if(def.id==='chicken')mesh=createChickenMesh();
else if(def.id==='cow')mesh=createCowMesh();
else{mesh=createHumanoid(def.color,def.id==='rat'?0.6:0.85);}
mesh.position.set(sx,0,sy);

// ---- A* PATHFINDING ----
function findPath(sx,sy,ex,ey){
if(!isWalkable(ex,ey)){
let best=null,bestD=Infinity;
for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
const nx=ex+dx,ny=ey+dy;
if(isWalkable(nx,ny)){const dd=Math.abs(nx-sx)+Math.abs(ny-sy);if(dd<bestD){bestD=dd;best={x:nx,y:ny};}}
}
if(best){ex=best.x;ey=best.y;}else return[];
}
if(sx===ex&&sy===ey)return[];
const open=[],closed=new Set();
const gS={},fS={},par={};
const k=(x,y)=>x+','+y;
const h=(x,y)=>Math.abs(x-ex)+Math.abs(y-ey);
const sk=k(sx,sy);
gS[sk]=0;fS[sk]=h(sx,sy);
open.push({x:sx,y:sy,f:fS[sk]});
let iters=0;
while(open.length>0&&iters<2000){
iters++;
open.sort((a,b)=>a.f-b.f);
const cur=open.shift();
const ck=k(cur.x,cur.y);
if(cur.x===ex&&cur.y===ey){
const path=[];let p=ck;
while(p){const[px,py]=p.split(',').map(Number);path.unshift({x:px,y:py});p=par[p];}
return path.slice(1);
}
closed.add(ck);
const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
for(const[ddx,ddy]of dirs){
const nx=cur.x+ddx,ny=cur.y+ddy;
const nk=k(nx,ny);
if(closed.has(nk)||!isWalkable(nx,ny))continue;
const ng=(gS[ck]||0)+1;
if(gS[nk]===undefined||ng<gS[nk]){
gS[nk]=ng;fS[nk]=ng+h(nx,ny);par[nk]=ck;
if(!open.some(o=>o.x===nx&&o.y===ny))open.push({x:nx,y:ny,f:fS[nk]});
}
}
}
return[];
}

// ---- COMBAT ----
function getEffectiveLevel(base,skill){
let bonus=0;
if(player.attackStyle==='accurate'&&skill==='attack')bonus=3;
if(player.attackStyle==='aggressive'&&skill==='strength')bonus=3;
if(player.attackStyle==='defensive'&&skill==='defence')bonus=3;
if(player.attackStyle==='controlled')bonus=1;
return Math.floor(base+bonus+8);
}
function getEquipBonus(type){
let b=0;
for(let slot in player.equipment){
const eid=player.equipment[slot];
if(eid){const itm=ITEMS[eid];if(itm){if(type==='atk')b+=(itm.atkBonus||0);if(type==='str')b+=(itm.strBonus||0);if(type==='def')b+=(itm.defBonus||0);}}
}
return b;
}
function calcMaxHit(){
const effStr=getEffectiveLevel(player.skills.strength.level,'strength');
const strBonus=getEquipBonus('str');
return Math.max(1,Math.floor(effStr*(strBonus+64)/640+0.5));
}
function calcHitChance(effAtk,atkBonus,effDef,defBonus){
const ar=effAtk*(atkBonus+64),dr=effDef*(defBonus+64);
if(ar>dr)return 1-(dr+2)/(2*(ar+1));
return ar/(2*(dr+1));
}
function playerAttackMonster(mon){
const effAtk=getEffectiveLevel(player.skills.attack.level,'attack');
const atkBonus=getEquipBonus('atk');
const effDef=Math.floor(mon.level+8);
const defBonus=0;
const hitChance=calcHitChance(effAtk,atkBonus,effDef,defBonus);
if(Math.random()<hitChance){
const maxHit=calcMaxHit();
const dmg=Math.floor(Math.random()*(maxHit+1));
if(dmg===0){showHitsplat(mon.mesh,0,true);return;}
mon.currentHp=Math.max(0,mon.currentHp-dmg);
showHitsplat(mon.mesh,dmg,false);
playSwordSwing();
if(player.attackStyle==='accurate')addXP('attack',dmg*4);
else if(player.attackStyle==='aggressive')addXP('strength',dmg*4);
else if(player.attackStyle==='defensive')addXP('defence',dmg*4);
else{addXP('attack',Math.floor(dmg*4/3));addXP('strength',Math.floor(dmg*4/3));addXP('defence',Math.floor(dmg*4/3));}
addXP('hitpoints',Math.floor(dmg*1.33));
if(mon.currentHp<=0)killMonster(mon);
}else{showHitsplat(mon.mesh,0,true);}
}
function monsterAttackPlayer(mon){
const effAtk=Math.floor(mon.level+8);
const effDef=getEffectiveLevel(player.skills.defence.level,'defence');
const defBonus=getEquipBonus('def');
const hitChance=calcHitChance(effAtk,0,effDef,defBonus);
if(Math.random()<hitChance){
const dmg=Math.floor(Math.random()*(mon.maxHit+1));
if(dmg===0){showHitsplat(playerMesh,0,true);return;}
player.currentHp=Math.max(0,player.currentHp-dmg);
showHitsplat(playerMesh,dmg,false);
updateOrbs();
if(player.currentHp<=0)playerDeath();
}else{showHitsplat(playerMesh,0,true);}
}
function killMonster(mon){
mon.alive=false;mon.mesh.visible=false;
mon.respawnAt=tickCount+50+Math.floor(Math.random()*30);
addChat('You defeated the '+mon.name+'!','combat');
mon.drops.forEach(drop=>{
if(Math.random()<drop.rate){
const qty=Array.isArray(drop.qty)?drop.qty[0]+Math.floor(Math.random()*(drop.qty[1]-drop.qty[0]+1)):drop.qty;
if(drop.id==='coins'){player.gold+=qty;addChat('You received '+qty+' coins.','item');}
else{const def=ITEMS[drop.id];if(def)addInventoryItem({id:drop.id,qty});}
}
});
player.inCombat=false;player.combatTarget=null;
}
function playerDeath(){
addChat('Oh dear, you are dead!','game');
player.inCombat=false;player.combatTarget=null;player.path=[];player.skillingAction=null;

function initAudio(){if(audioStarted)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioStarted=true;}catch(e){}}

if(!audioCtx)return;
try{
const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.04,audioCtx.sampleRate);
const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/800)*0.15;
const src=audioCtx.createBufferSource();src.buffer=buf;
const f=audioCtx.createBiquadFilter();f.frequency.value=150;

}catch(e){}
}

gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.12);
}catch(e){}
}

[880,1320].forEach((freq,i)=>{

[261,329,392,523].forEach((freq,i)=>{

// ---- ITEM INTERACTIONS ----
function useInventoryItem(idx){
const item=player.inventory[idx];if(!item)return;
const def=ITEMS[item.id];if(!def)return;
if(def.type==='weapon'){
const old=player.equipment.weapon;
player.equipment.weapon=item.id;
player.inventory.splice(idx,1);
if(old)addInventoryItem({id:old,qty:1});
addChat('You equip the '+def.name+'.','item');
renderPanel();return;
}
if(def.heals){
if(player.currentHp>=player.maxHp){addChat('You are already at full health.','game');return;}
player.currentHp=Math.min(player.maxHp,player.currentHp+def.heals);
removeInventoryItem(idx);
addChat('You eat the '+def.name+'. It heals '+def.heals+'.','game');
updateOrbs();return;
}
if(item.id==='bones'){
removeInventoryItem(idx);
addXP('prayer',5);addChat('You bury the bones.','game');return;
}
addChat(def.examine,'game');
}

addInventoryItem({id:eid,qty:1});
addChat('You unequip the '+ITEMS[eid].name+'.','item');
renderPanel();
}

// ---- SKILLING ----
function startSkilling(action,objRef){
player.skillingAction=action;player.skillingTicks=0;player.skillingObj=objRef;
player.path=[];player.inCombat=false;player.combatTarget=null;
}
function processSkilling(){
if(!player.skillingAction)return;
player.skillingTicks++;
const action=player.skillingAction;
if(action==='chop_tree'){
if(player.skillingTicks>=4){
player.skillingTicks=0;
if(Math.random()<0.6){
if(addInventoryItem({id:'logs',qty:1})){
addXP('woodcutting',25);addChat('You get some logs.','game');playPickup();
}
if(player.skillingObj){player.skillingObj.alive=false;if(player.skillingObj.mesh)player.skillingObj.mesh.visible=false;
player.skillingObj.respawnAt=tickCount+50+Math.floor(Math.random()*30);
const ti=tIdx(player.skillingObj.tile.x,player.skillingObj.tile.y);clipFlags[ti]=0;
}
player.skillingAction=null;
}
}
}
else if(action==='fish'){
if(player.skillingTicks>=5){
player.skillingTicks=0;
if(Math.random()<0.5){
if(addInventoryItem({id:'raw_shrimps',qty:1})){
addXP('fishing',10);addChat('You catch some shrimps.','game');playPickup();
}
}
if(player.inventory.length>=28)player.skillingAction=null;
}
}
else if(action==='mine'){
if(player.skillingTicks>=5){
player.skillingTicks=0;
if(Math.random()<0.5){
if(addInventoryItem({id:'copper_ore',qty:1})){
addXP('mining',18);addChat('You mine some copper ore.','game');playPickup();
}
if(player.skillingObj){player.skillingObj.alive=false;if(player.skillingObj.mesh)player.skillingObj.mesh.visible=false;
player.skillingObj.respawnAt=tickCount+40+Math.floor(Math.random()*20);
const ti=tIdx(player.skillingObj.tile.x,player.skillingObj.tile.y);clipFlags[ti]=0;
}
player.skillingAction=null;
}
}
}
else if(action==='cook'){
if(player.skillingTicks>=3){
player.skillingTicks=0;
const rawIdx=player.inventory.findIndex(i=>i.id==='raw_chicken'||i.id==='raw_beef'||i.id==='raw_shrimps');
if(rawIdx>=0){
const raw=player.inventory[rawIdx];
const burnChance=Math.max(0,(50-player.skills.cooking.level)/100);
const cookedMap={raw_chicken:'cooked_chicken',raw_beef:'cooked_meat',raw_shrimps:'cooked_shrimps'};
removeInventoryItem(rawIdx);
if(Math.random()<burnChance){addChat('You accidentally burn the food.','game');}
else{
const cookedId=cookedMap[raw.id]||'cooked_meat';
addInventoryItem({id:cookedId,qty:1});
addXP('cooking',30);addChat('You cook the food successfully.','game');
}
}
player.skillingAction=null;
}
}
}

// ---- GAME TICK ----
function gameTick(){
tickCount++;
if(player.path.length>0&&!player.inCombat){
const next=player.path[0];
if(isWalkable(next.x,next.y)){
player.tile={...next};player.path.shift();
if(player.isRunning&&player.runEnergy>0&&player.path.length>0){
player.runEnergy=Math.max(0,player.runEnergy-0.6);
const next2=player.path[0];
if(next2&&isWalkable(next2.x,next2.y)){player.tile={...next2};player.path.shift();}
}
playFootstep();
checkTileInteractions();
}else{player.path=[];}
}
if(!player.isRunning||player.path.length===0){player.runEnergy=Math.min(100,player.runEnergy+0.3);}
if(tickCount%15===0&&player.currentHp<player.maxHp&&!player.inCombat){player.currentHp=Math.min(player.maxHp,player.currentHp+1);updateOrbs();}
if(player.inCombat&&player.combatTarget!==null){
const mon=monsterInstances[player.combatTarget];
if(!mon||!mon.alive){player.inCombat=false;player.combatTarget=null;}
else{
const dist=Math.abs(player.tile.x-mon.currentTile.x)+Math.abs(player.tile.y-mon.currentTile.y);
if(dist>1){
const p=findPath(player.tile.x,player.tile.y,mon.currentTile.x,mon.currentTile.y);
if(p.length>0){player.tile={...p[0]};if(p.length>1&&player.isRunning)player.tile={...p[1]};}
else{player.inCombat=false;player.combatTarget=null;}
}else{
player.attackCooldown--;
if(player.attackCooldown<=0){playerAttackMonster(mon);player.attackCooldown=4;}
mon.atkCooldown--;
if(mon.atkCooldown<=0&&mon.alive){monsterAttackPlayer(mon);mon.atkCooldown=mon.atkSpeed;}
}
}
}
monsterInstances.forEach(mon=>{
if(!mon.alive){
if(tickCount>=mon.respawnAt){
mon.alive=true;mon.currentHp=mon.hp;
mon.currentTile={...mon.spawnTile};
mon.mesh.position.set(mon.spawnTile.x,0,mon.spawnTile.y);
mon.mesh.visible=true;
}
return;
}
if(mon.aggressive&&mon.aggroRange>0&&!player.inCombat){
const dist=Math.abs(player.tile.x-mon.currentTile.x)+Math.abs(player.tile.y-mon.currentTile.y);
if(dist<=mon.aggroRange){
player.inCombat=true;player.combatTarget=mon.idx;player.path=[];player.skillingAction=null;
player.attackCooldown=1;mon.atkCooldown=1;
addChat('The '+mon.name+' attacks you!','combat');
}
}
if(!mon.target){
mon.wanderTimer--;
if(mon.wanderTimer<=0){
mon.wanderTimer=8+Math.floor(Math.random()*10);
const dx=Math.floor(Math.random()*3)-1,dy=Math.floor(Math.random()*3)-1;
const nx=mon.currentTile.x+dx,ny=mon.currentTile.y+dy;
if(isWalkable(nx,ny)&&Math.abs(nx-mon.spawnTile.x)<5&&Math.abs(ny-mon.spawnTile.y)<5){
mon.currentTile={x:nx,y:ny};
}
}
}
});
npcInstances.forEach(npc=>{
if(npc.wander>0){
npc.wanderTimer--;
if(npc.wanderTimer<=0){
npc.wanderTimer=10+Math.floor(Math.random()*15);
const dx=Math.floor(Math.random()*3)-1,dy=Math.floor(Math.random()*3)-1;
const nx=npc.currentTile.x+dx,ny=npc.currentTile.y+dy;
if(isWalkable(nx,ny)&&Math.abs(nx-npc.homeTile.x)<=npc.wander&&Math.abs(ny-npc.homeTile.y)<=npc.wander){
npc.currentTile={x:nx,y:ny};
}
}
}
});
processSkilling();
worldObjects.forEach(obj=>{
if((obj.type==='tree'||obj.type==='rock')&&!obj.alive&&tickCount>=obj.respawnAt){
obj.alive=true;if(obj.mesh)obj.mesh.visible=true;
clipFlags[tIdx(obj.tile.x,obj.tile.y)]=1;
}
if(obj.type==='ground_item'&&obj.taken&&tickCount>=obj.respawnAt){
obj.taken=false;if(obj.mesh)obj.mesh.visible=true;
}
});
groundItems.forEach(gi=>{
if(gi.taken&&tickCount>=gi.respawnAt){gi.taken=false;if(gi.mesh)gi.mesh.visible=true;}
});
updateOrbs();
}

}
let clickedObj=null;

if(objHits.length>0){
const hitMesh=objHits[0].object;
const om=objectMeshes.find(o=>{

});
if(om)clickedObj=om.obj;

for(const gi of groundItems){

function handleObjectClick(obj){
const dist=Math.abs(player.tile.x-obj.tile.x)+Math.abs(player.tile.y-obj.tile.y);
if(dist>2){
player.path=findPath(player.tile.x,player.tile.y,obj.tile.x,obj.tile.y);
player.skillingAction=null;
const objRef=obj;
const checkInterval=setInterval(()=>{
const d2=Math.abs(player.tile.x-objRef.tile.x)+Math.abs(player.tile.y-objRef.tile.y);
if(d2<=2){clearInterval(checkInterval);handleObjectInteraction(objRef);}
if(player.path.length===0){clearInterval(checkInterval);}
},300);
return;
}
handleObjectInteraction(obj);
}
function handleObjectInteraction(obj){
if(obj.type==='tree'&&obj.alive){
addChat('You begin chopping the tree...','game');
startSkilling('chop_tree',obj);
}else if(obj.type==='rock'&&obj.alive){
addChat('You begin mining the rock...','game');
startSkilling('mine',obj);
}else if(obj.type==='fish'){
addChat('You begin fishing...','game');
startSkilling('fish',obj);
}else if(obj.type==='range'){
const rawIdx=player.inventory.findIndex(i=>i.id==='raw_chicken'||i.id==='raw_beef'||i.id==='raw_shrimps');
if(rawIdx>=0){addChat('You begin cooking...','game');startSkilling('cook',obj);}
else addChat('You need raw food to cook.','game');
}else if(obj.type==='coffin'){
if(player.quests.restless_spirit==='in_progress'&&hasItem('ghost_skull')&&!player.questFlags.skullReturned){
const idx=player.inventory.findIndex(i=>i.id==='ghost_skull');
if(idx>=0){removeInventoryItem(idx);player.questFlags.skullReturned=true;
player.quests.restless_spirit='complete';
addXP('prayer',1125);player.gold+=50;
addChat('Quest complete: The Restless Spirit! +1125 Prayer XP','quest');
playLevelUp();updateQuestPoints();}
}else addChat('An old stone coffin.','game');
}else if(obj.type==='ground_item'&&!obj.taken){
if(addInventoryItem({id:obj.itemId,qty:obj.qty})){
obj.taken=true;if(obj.mesh)obj.mesh.visible=false;
obj.respawnAt=tickCount+200;
addChat('You pick up: '+ITEMS[obj.itemId].name,'item');

if(obj.itemId==='ghost_skull')player.questFlags.skullFound=true;

}else if(obj.type==='dairy'){

player.questFlags.milkDone=true;

playPickup();checkFeastQuest();
}else addChat('A dairy cow.','game');
}
}

mCtx.fillStyle='#0a1a0a';mCtx.fillRect(0,0,152,152);
const scale=2.5;
const ox=76-player.tile.x*scale,oy=76-player.tile.y*scale;
for(let y=0;y<MAP;y++)for(let x=0;x<MAP;x++){
const px=ox+x*scale,py=oy+y*scale;
if(px<-3||px>155||py<-3||py>155)continue;
mCtx.fillStyle=TILE_COLORS[tileMap[tIdx(x,y)]];
mCtx.fillRect(px,py,scale,scale);
}
mCtx.fillStyle='#ffff00';
npcInstances.forEach(n=>{const px=ox+n.currentTile.x*scale,py=oy+n.currentTile.y*scale;mCtx.fillRect(px,py,3,3);});
mCtx.fillStyle='#ff3333';
monsterInstances.forEach(m=>{if(m.alive){const px=ox+m.currentTile.x*scale,py=oy+m.currentTile.y*scale;mCtx.fillRect(px,py,2,2);}});
mCtx.fillStyle='#ffffff';
mCtx.fillRect(76-1,76-1,3,3);
}

minimapCanvas.addEventListener('click',(e)=>{
const rect=minimapCanvas.getBoundingClientRect();
const mx=e.clientX-rect.left,my=e.clientY-rect.top;
const scale=2.5;
const tx=Math.round(player.tile.x+(mx-76)/scale);
const ty=Math.round(player.tile.y+(my-76)/scale);
if(tx>=0&&tx<MAP&&ty>=0&&ty<MAP){
player.path=findPath(player.tile.x,player.tile.y,tx,ty);
player.inCombat=false;player.combatTarget=null;player.skillingAction=null;
}
});

// ---- PANEL TAB CLICKS ----
document.querySelectorAll('.panel-tab').forEach(tab=>{
tab.addEventListener('click',()=>{
activePanel=tab.dataset.panel;
document.querySelectorAll('.panel-tab').forEach(t=>t.classList.toggle('active',t===tab));
renderPanel();
});
});

// Chat tabs
document.querySelectorAll('.chat-tab').forEach(tab=>{
tab.addEventListener('click',()=>{
chatFilter=tab.dataset.ct;
document.querySelectorAll('.chat-tab').forEach(t=>t.classList.toggle('active',t===tab));
});
});

// Bank
document.getElementById('bank-close').addEventListener('click',closeBank);
document.getElementById('deposit-all-btn').addEventListener('click',depositAll);

// Run orb toggle
document.getElementById('run-orb').addEventListener('click',()=>{
player.isRunning=!player.isRunning;
addChat('Running: '+(player.isRunning?'ON':'OFF'),'game');
});

// ---- SAVE / LOAD ----
function saveGame(){
const save={
v:2,tile:player.tile,skills:player.skills,currentHp:player.currentHp,maxHp:player.maxHp,
prayer:player.prayer,maxPrayer:player.maxPrayer,runEnergy:player.runEnergy,
inventory:player.inventory,equipment:player.equipment,
bank:bank.items,gold:player.gold,quests:player.quests,questFlags:player.questFlags,
deathCount:player.deathCount,attackStyle:player.attackStyle,ts:Date.now()
};
try{localStorage.setItem('irondale_save_v2',JSON.stringify(save));}catch(e){}
const si=document.getElementById('save-indicator');si.style.opacity='1';
setTimeout(()=>si.style.opacity='0',1500);
}
function loadGame(){
try{
const raw=localStorage.getItem('irondale_save_v2');if(!raw)return false;
const s=JSON.parse(raw);
player.tile={...s.tile};player.skills={...player.skills,...s.skills};
player.currentHp=s.currentHp;player.maxHp=s.maxHp;
player.prayer=s.prayer||1;player.maxPrayer=s.maxPrayer||1;
player.runEnergy=s.runEnergy||100;
player.inventory=s.inventory||[];player.equipment=s.equipment||player.equipment;
bank.items=s.bank||[];player.gold=s.gold||0;
player.quests={...player.quests,...(s.quests||{})};
player.questFlags={...player.questFlags,...(s.questFlags||{})};
player.deathCount=s.deathCount||0;player.attackStyle=s.attackStyle||'accurate';
playerMesh.position.set(player.tile.x,0,player.tile.y);
document.getElementById('death-count').textContent=player.deathCount;
updateOrbs();updateStatsPanel();updateQuestPoints();
return true;
}catch(e){return false;}
}
setInterval(saveGame,30000);
window.addEventListener('beforeunload',saveGame);

// ---- RENDER LOOP ----
const clock=new THREE.Clock();
let animFrame=0;
function animate(){
requestAnimationFrame(animate);
const dt=clock.getDelta();
animFrame++;
const targetPos=new THREE.Vector3(player.tile.x,0,player.tile.y);
playerMesh.position.lerp(targetPos,0.15);
const camTarget=new THREE.Vector3(player.tile.x+30,40,player.tile.y+30);
camera.position.lerp(camTarget,0.08);
camera.lookAt(player.tile.x,0,player.tile.y);
npcInstances.forEach(npc=>{
npc.mesh.position.lerp(new THREE.Vector3(npc.currentTile.x,0,npc.currentTile.y),0.1);
});
monsterInstances.forEach(mon=>{
if(mon.alive)mon.mesh.position.lerp(new THREE.Vector3(mon.currentTile.x,0,mon.currentTile.y),0.1);
});
if(animFrame%3===0&&instancedMeshes[TILE_TYPES.WATER]){
const wm=instancedMeshes[TILE_TYPES.WATER];
const c=new THREE.Color();
const bright=0.5+Math.sin(animFrame*0.05)*0.15;
c.setHSL(0.58,0.7,bright*0.3);
wm.material.color=c;
}
worldObjects.filter(o=>o.type==='fish').forEach(o=>{
if(o.mesh)o.mesh.material.opacity=0.3+Math.sin(animFrame*0.08)*0.4;
});
renderer.render(scene,camera);
}

// ---- MINIMAP INTERVAL ----
setInterval(renderMinimap,500);

// ---- GAME TICK INTERVAL ----
setInterval(gameTick,TICK_MS);

// ---- LOADING SEQUENCE ----
const loadBar=document.getElementById('load-bar');
const loadStatus=document.getElementById('load-status');
const loadSteps=['Initializing world...','Building Irondale...','Spawning NPCs...','Forging weapons...','Ready!'];
let loadStep=0;
function advanceLoading(){
if(loadStep<loadSteps.length){
loadBar.style.width=(loadStep+1)/loadSteps.length*100+'%';
loadStatus.textContent=loadSteps[loadStep];
loadStep++;
if(loadStep<loadSteps.length)setTimeout(advanceLoading,400);
else{
setTimeout(()=>{
document.getElementById('loading-screen').style.display='none';
const loaded=loadGame();
if(loaded)addChat('Welcome back to Irondale, adventurer!','game');
else{
addChat('Welcome to Irondale! Talk to the Town Guide for help.','game');
addChat('Right-click entities for options. Left-click to move/interact.','game');
}
renderPanel();renderMinimap();updateOrbs();updateQuestPoints();
},500);
}
}
}
setTimeout(advanceLoading,300);

// Start animation
animate();

// ---- FEAST QUEST TURN-IN ----
const origOpenDialog=openDialog;
function patchedOpenDialog(npcId,nodeIdx){
nodeIdx=nodeIdx||0;
if(npcId==='cook'&&player.quests.feast_assistant==='in_progress'){
if(hasItem('bucket_milk')&&hasItem('egg')&&hasItem('pot_flour')){
const mi=player.inventory.findIndex(i=>i.id==='bucket_milk');if(mi>=0)removeInventoryItem(mi);
const ei=player.inventory.findIndex(i=>i.id==='egg');if(ei>=0)removeInventoryItem(ei);
const fi=player.inventory.findIndex(i=>i.id==='pot_flour');if(fi>=0)removeInventoryItem(fi);
player.quests.feast_assistant='complete';
addXP('cooking',300);player.gold+=50;
addChat("Quest complete: The Duke's Feast! +300 Cooking XP, +50gp",'quest');
playLevelUp();updateQuestPoints();
const panel=document.getElementById('dialog-panel');
document.getElementById('dialog-name').textContent='Gareth the Cook';
document.getElementById('dialog-text').textContent="You've done it! The feast is saved! Here's your reward.";
document.getElementById('dialog-options').innerHTML='';
const dd=document.createElement('div');dd.className='dialog-option';dd.textContent='Farewell.';
dd.addEventListener('click',closeDialog);
document.getElementById('dialog-options').appendChild(dd);
panel.style.display='block';
currentDialog={npcId:'cook',nodeIdx:0};
return;
}
}
if(npcId==='farmer'&&player.quests.feast_assistant==='in_progress'&&!player.questFlags.eggDone){
addInventoryItem({id:'egg',qty:1});
player.questFlags.eggDone=true;
addChat('Fred gives you an egg!','item');
playPickup();checkFeastQuest();
}
origOpenDialog(npcId,nodeIdx);
}
openDialog=patchedOpenDialog;

}); // end window.addEventListener('load', ...)

})();
</script>
