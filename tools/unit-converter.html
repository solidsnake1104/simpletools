<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unit Converter — SimpleTools</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .tool-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--accent); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .tool-section { margin-bottom: 2rem; }
    .category-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .category-tab { padding: 0.6rem 1rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; cursor: pointer; color: var(--text); }
    .category-tab.active { background: var(--accent); color: var(--bg); }
    .converter-row { display: grid; grid-template-columns: 1fr 150px 1fr 150px 1fr; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--muted); }
    .form-group input, .form-group select { width: 100%; padding: 0.6rem; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: var(--text); }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
    .swap-btn { padding: 0.6rem 1rem; background: var(--accent); color: var(--bg); border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
    .equals { text-align: center; font-weight: bold; }
    @media (max-width: 768px) { 
      .converter-row { grid-template-columns: 1fr; }
      .equals { display: none; }
      .swap-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
            <a href="../index.html" class="logo-link">
        <img src="../logo_transparent.png" alt="SimpleTools logo" class="site-logo" />
      </a>
      <a href="../index.html" class="back-link">← Back to Tools</a>
      <h1 class="logo">Unit Converter</h1>
    </div>
  </header>

  <main class="tool-container">
    <section class="tool-section">
      <h2>Select Category</h2>
      <div class="category-tabs">
        <button class="category-tab active" data-category="length">Length</button>
        <button class="category-tab" data-category="weight">Weight</button>
        <button class="category-tab" data-category="temperature">Temperature</button>
        <button class="category-tab" data-category="volume">Volume</button>
        <button class="category-tab" data-category="speed">Speed</button>
        <button class="category-tab" data-category="area">Area</button>
      </div>
    </section>

    <section class="tool-section">
      <h2>Convert</h2>
      <div class="converter-row">
        <div class="form-group">
          <label for="input1">From</label>
          <input type="number" id="input1" placeholder="0" />
        </div>
        <div class="form-group">
          <label for="unit1">Unit</label>
          <select id="unit1"></select>
        </div>
        <div class="equals">=</div>
        <div class="form-group">
          <label for="unit2">To</label>
          <select id="unit2"></select>
        </div>
        <div class="form-group">
          <label for="input2" style="opacity: 0;">Result</label>
          <input type="text" id="input2" readonly placeholder="0" />
        </div>
      </div>
    </section>

    <section class="tool-section" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.06);">
      <h3>About This Tool</h3>
      <p>Convert between common units instantly. All calculations are performed locally in your browser with up to 8 decimal places of precision.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <p>&copy; <span id="year"></span> SimpleTools — Small apps, big impact.</p>
        <div class="theme-controls">
          <label for="theme-select" class="visually-hidden">Theme</label>
          <select id="theme-select" aria-label="Select seasonal theme">
            <option value="auto">Auto (by date)</option>
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="autumn">Autumn</option>
            <option value="winter">Winter</option>
            <option value="default">Default</option>
          </select>
        </div>
      </div>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    const categories = {
      length: { units: ['Meters', 'Kilometers', 'Miles', 'Feet', 'Inches', 'Yards'], factors: [1, 0.001, 0.000621371, 3.28084, 39.3701, 1.09361] },
      weight: { units: ['Grams', 'Kilograms', 'Pounds', 'Ounces'], factors: [1, 0.001, 0.00220462, 0.035274] },
      temperature: { units: ['Celsius', 'Fahrenheit', 'Kelvin'], formula: true },
      volume: { units: ['Liters', 'Milliliters', 'Gallons (US)', 'Pints (US)', 'Cups'], factors: [1, 1000, 0.264172, 2.11338, 4.22675] },
      speed: { units: ['m/s', 'km/h', 'mph', 'knots'], factors: [1, 3.6, 2.23694, 1.94384] },
      area: { units: ['Square Meters', 'Square Kilometers', 'Square Miles', 'Square Feet', 'Hectares'], factors: [1, 0.000001, 0.000000386102, 10.7639, 0.0001] }
    };

    const categoryTabs = document.querySelectorAll('.category-tab');
    const unit1Select = document.getElementById('unit1');
    const unit2Select = document.getElementById('unit2');
    const input1 = document.getElementById('input1');
    const input2 = document.getElementById('input2');
    let currentCategory = 'length';

    categoryTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        categoryTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.category;
        updateUnits();
      });
    });

    function updateUnits() {
      const units = categories[currentCategory].units;
      unit1Select.innerHTML = units.map((u, i) => `<option value="${i}">${u}</option>`).join('');
      unit2Select.innerHTML = units.map((u, i) => `<option value="${i}">${u}</option>`).join('');
      if (units.length > 1) unit2Select.value = 1;
      convert();
    }

    function convert() {
      const value = parseFloat(input1.value) || 0;
      const fromIndex = parseInt(unit1Select.value);
      const toIndex = parseInt(unit2Select.value);
      const cat = categories[currentCategory];

      let result;
      if (cat.formula) {
        result = convertTemperature(value, unit1Select.options[fromIndex].text, unit2Select.options[toIndex].text);
      } else {
        const fromFactor = cat.factors[fromIndex];
        const toFactor = cat.factors[toIndex];
        result = (value * fromFactor) / toFactor;
      }

      input2.value = result.toFixed(8).replace(/\.?0+$/, '');
    }

    function convertTemperature(value, fromUnit, toUnit) {
      let celsius = value;
      if (fromUnit === 'Fahrenheit') celsius = (value - 32) * 5/9;
      if (fromUnit === 'Kelvin') celsius = value - 273.15;

      if (toUnit === 'Fahrenheit') return celsius * 9/5 + 32;
      if (toUnit === 'Kelvin') return celsius + 273.15;
      return celsius;
    }

    input1.addEventListener('input', convert);
    unit1Select.addEventListener('change', convert);
    unit2Select.addEventListener('change', convert);

    updateUnits();
  </script>
</body>
</html>
