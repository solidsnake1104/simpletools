<!doctype html>
<html lang="en" data-theme="default">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2884785253571228"
     crossorigin="anonymous"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF Joiner • SimpleTools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" type="image/png" href="../site_icon.png" />
  <link rel="shortcut icon" type="image/png" href="../site_icon.png" />
  <link rel="apple-touch-icon" href="../site_icon.png" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="logo-link">
        <img src="../logo_transparent.png" alt="SimpleTools logo" class="site-logo" />
      </a>

      <h1 class="logo">PDF Joiner</h1>
    </div>
  </header>

  <main class="tool-container">

    <!-- MODE TABS (only Join remains) -->
    <section class="tool-section">
      <h2>Select Mode</h2>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="join">Join Documents</button>
      </div>
    </section>

    <!-- JOIN MODE ONLY -->
    <section class="tool-section" id="joinMode">
      <h2>Select Files to Join</h2>
      <div class="upload-area" id="uploadAreaJoin">
        <p><strong>Click to upload or drag and drop</strong></p>
        <p style="color:var(--muted);font-size:0.9rem;">Select multiple PDF files</p>
        <input type="file" id="fileInputJoin" class="file-input" multiple accept=".pdf" />
      </div>
      <ul class="file-list" id="fileListJoin"></ul>
      <button class="btn" id="processJoinBtn" disabled>Join Documents</button>
    </section>

    <section class="tool-section" style="margin-top:3rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,0.06);">
      <h3>About This Tool</h3>
      <p>Join documents directly in your browser — no files are uploaded to any server.</p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <p>&copy; <span id="year"></span> SimpleTools • Small apps, big impact.</p>
        <div class="theme-controls">
          <label for="theme-select" class="visually-hidden">Theme</label>
          <select id="theme-select">
            <option value="auto">Auto (by date)</option>
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="autumn">Autumn</option>
            <option value="winter">Winter</option>
            <option value="default">Default</option>
          </select>
        </div>
      </div>
    </div>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
