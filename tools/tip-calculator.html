<!doctype html>
<html lang="en" data-theme="default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tip Calculator — SimpleTools</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" type="image/png" href="../site_icon.png" />
  <link rel="shortcut icon" type="image/png" href="../site_icon.png" />
  <link rel="apple-touch-icon" href="../site_icon.png" />
  <style>
    .tool-container { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }
    .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--accent); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .tool-section { margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 0.8rem; background: transparent; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: var(--text); font-size: 1.1rem; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
    .tip-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
    .tip-btn { padding: 0.8rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; cursor: pointer; color: var(--text); font-weight: 500; }
    .tip-btn.active { background: var(--accent); color: var(--bg); }
    .result-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 2rem 0; }
    .result-card { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }
    .result-label { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
    .result-value { font-size: 1.8rem; font-weight: bold; color: var(--accent); }
    .large-result { grid-column: 1 / -1; }
    @media (max-width: 600px) {
      .tip-buttons { grid-template-columns: repeat(3, 1fr); }
      .result-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
            <a href="../index.html" class="logo-link">
        <img src="../logo_transparent.png" alt="SimpleTools logo" class="site-logo" />
      </a>
      <a href="../index.html" class="back-link">← Back to Tools</a>
      <h1 class="logo">Tip Calculator</h1>
    </div>
  </header>

  <!-- Responsive Ad Unit -->
  <div class="ad-container container">
    <div class="ad-container-placeholder">PLACE ADS HERE</div>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID"
       crossorigin="anonymous"></script>
    <!-- SimpleTools Responsive -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-YOUR_PUBLISHER_ID"
         data-ad-slot="YOUR_AD_SLOT_ID"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <main class="tool-container">
    <section class="tool-section">
      <div class="form-group">
        <label for="billAmount">Bill Amount ($)</label>
        <input type="number" id="billAmount" placeholder="0.00" min="0" step="0.01" />
      </div>

      <div class="form-group">
        <label>Tip Percentage</label>
        <div class="tip-buttons">
          <button class="tip-btn" data-tip="10">10%</button>
          <button class="tip-btn" data-tip="15">15%</button>
          <button class="tip-btn" data-tip="18">18%</button>
          <button class="tip-btn active" data-tip="20">20%</button>
          <button class="tip-btn" data-tip="25">25%</button>
        </div>
      </div>

      <div class="form-group">
        <label for="customTip">Custom Tip (%)</label>
        <input type="number" id="customTip" placeholder="0" min="0" step="1" />
      </div>

      <div class="form-group">
        <label for="people">Number of People</label>
        <input type="number" id="people" value="1" min="1" step="1" />
      </div>

      <div style="margin-bottom: 1rem;">
        <label style="display: flex; align-items: center;">
          <input type="checkbox" id="roundUp" style="width: auto; margin-right: 0.5rem;" />
          <span>Round up per person</span>
        </label>
      </div>
    </section>

    <section class="tool-section">
      <div class="result-cards">
        <div class="result-card">
          <div class="result-label">Tip Amount</div>
          <div class="result-value" id="tipAmount">$0.00</div>
        </div>
        <div class="result-card">
          <div class="result-label">Total Bill</div>
          <div class="result-value" id="totalBill">$0.00</div>
        </div>
        <div class="result-card large-result">
          <div class="result-label">Per Person</div>
          <div class="result-value" id="perPerson">$0.00</div>
        </div>
      </div>
    </section>

    <section class="tool-section" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.06);">
      <h3>About This Tool</h3>
      <p>Calculate tips and split bills instantly. Perfect for restaurants, bars, and any service situation where quick calculations are needed.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <p>&copy; <span id="year"></span> SimpleTools — Small apps, big impact.</p>
        <div class="theme-controls">
          <label for="theme-select" class="visually-hidden">Theme</label>
          <select id="theme-select" aria-label="Select seasonal theme">
            <option value="auto">Auto (by date)</option>
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="autumn">Autumn</option>
            <option value="winter">Winter</option>
            <option value="default">Default</option>
          </select>
        </div>
      </div>
    </div>
  </footer>

  <script src="../script.js"></script>
  <script>
    const billAmount = document.getElementById('billAmount');
    const tipButtons = document.querySelectorAll('.tip-btn');
    const customTip = document.getElementById('customTip');
    const people = document.getElementById('people');
    const roundUp = document.getElementById('roundUp');
    const tipAmountDisplay = document.getElementById('tipAmount');
    const totalBillDisplay = document.getElementById('totalBill');
    const perPersonDisplay = document.getElementById('perPerson');
    let activeTipPercentage = 20;

    tipButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tipButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTipPercentage = parseFloat(btn.dataset.tip);
        customTip.value = '';
        calculate();
      });
    });

    customTip.addEventListener('input', () => {
      if (customTip.value) {
        tipButtons.forEach(b => b.classList.remove('active'));
        activeTipPercentage = parseFloat(customTip.value) || 0;
      }
      calculate();
    });

    billAmount.addEventListener('input', calculate);
    people.addEventListener('input', calculate);
    roundUp.addEventListener('change', calculate);

    function calculate() {
      const bill = parseFloat(billAmount.value) || 0;
      const tipPercent = parseFloat(customTip.value) || activeTipPercentage;
      const numPeople = Math.max(1, parseInt(people.value) || 1);

      const tipAmount = bill * (tipPercent / 100);
      const total = bill + tipAmount;
      let perPerson = total / numPeople;

      if (roundUp.checked) {
        perPerson = Math.ceil(perPerson);
      }

      tipAmountDisplay.textContent = '$' + tipAmount.toFixed(2);
      totalBillDisplay.textContent = '$' + total.toFixed(2);
      perPersonDisplay.textContent = '$' + perPerson.toFixed(2);
    }

    calculate();
  </script>
</body>
</html>
