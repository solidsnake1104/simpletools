<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Misthalin Isometric RPG</title>
<style>
:root{--panel:#27190c;--trim:#8b6a36;--text:#ecd8a0;--muted:#bca879}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070503;color:var(--text);font-family:Georgia,"Times New Roman",serif}
#app{width:100vw;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 286px;grid-template-rows:minmax(0,1fr) 150px;gap:4px;padding:4px;background:linear-gradient(#26180a,#090604)}
#gameWrap{position:relative;grid-column:1;grid-row:1;border:3px ridge var(--trim);overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
#game,#labels{position:absolute;inset:0}
#hud{position:absolute;left:8px;top:7px;z-index:5;text-shadow:1px 1px #000;font-size:14px;color:#fff1a8;pointer-events:none}
#pills{position:absolute;left:8px;top:31px;display:flex;gap:6px;z-index:5;pointer-events:none;font-size:13px}
.pill{background:rgba(20,12,6,.82);border:1px solid var(--trim);border-radius:999px;padding:3px 7px;text-shadow:1px 1px #000}
#side{grid-column:2;grid-row:1/span 2;border:3px ridge var(--trim);background:var(--panel);display:grid;grid-template-rows:170px auto minmax(0,1fr);overflow:hidden}
#miniWrap{position:relative;background:#101010;border-bottom:2px groove var(--trim)}
#mini{width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
#orbs{position:absolute;right:4px;top:4px;display:grid;gap:3px}
.orb{width:52px;height:22px;border-radius:999px;border:2px ridge #6c522b;background:#191007;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;text-shadow:1px 1px #000}
.hp{color:#ff8a80}.run{color:#ffe27c}.song{color:#9bff9b}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:3px;background:#171008}
.tab{min-height:28px;border:2px outset var(--trim);background:#493315;color:var(--text);font-weight:bold;font-size:12px}
.tab.active{background:#76521f;color:#fff0b5}
#panel{overflow:auto;padding:7px;font-size:13px;line-height:1.32}
.title{color:#c9a55c;font-weight:bold;border-bottom:1px solid var(--trim);padding-bottom:3px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.gridInv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.slot{min-height:34px;background:#15100a;border:2px inset #6a4b21;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;padding:2px;position:relative;color:#f2ddb1}
.slot .qty{position:absolute;right:2px;bottom:0;color:#ffea70;font-size:10px;text-shadow:1px 1px #000}
#chat{grid-column:1;grid-row:2;border:3px ridge var(--trim);background:#20150b;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}
#messages{overflow:auto;padding:5px 8px;font-size:13px;line-height:1.25}
.msg{margin-bottom:2px}.system{color:#d9c178}.combat{color:#ff928a}.loot{color:#9cff9c}.quest{color:#ffe36e}
#actions{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:4px;background:#140d07}
button{border:2px outset var(--trim);background:#4a341a;color:var(--text);font-family:Georgia,"Times New Roman",serif;font-weight:bold;font-size:12px;min-height:31px;cursor:pointer}
button:active{border-style:inset;transform:translateY(1px)}
@media(max-width:760px) and (orientation:landscape){
  #app{grid-template-columns:minmax(0,1fr) 176px;grid-template-rows:minmax(0,1fr) 105px;gap:2px;padding:2px}
  #side{grid-template-rows:96px auto minmax(0,1fr)}
  #panel{padding:5px}.tab{min-height:25px;font-size:10px}button{min-height:26px}
}
</style>
</head>
<body>
<div id="app">
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <canvas id="labels"></canvas>
    <div id="hud">Walk here</div>
    <div id="pills">
      <div class="pill" id="locPill">Misthalin</div>
      <div class="pill" id="targetPill">No target</div>
    </div>
  </div>

  <div id="chat">
    <div id="messages"></div>
    <div id="actions">
      <button id="btnTalk">Talk</button>
      <button id="btnAttack">Attack</button>
      <button id="btnUse">Use</button>
      <button id="btnSearch">Search</button>
      <button id="btnBank">Bank</button>
      <button id="btnSave">Save</button>
    </div>
  </div>

  <aside id="side">
    <div id="miniWrap">
      <canvas id="mini"></canvas>
      <div id="orbs">
        <div class="orb hp" id="hpOrb">HP</div>
        <div class="orb run" id="runOrb">Run</div>
        <div class="orb song" id="songOrb">Music</div>
      </div>
    </div>
    <div id="tabs">
      <button class="tab active" data-tab="combat">⚔</button>
      <button class="tab" data-tab="map">🗺</button>
      <button class="tab" data-tab="inv">🎒</button>
      <button class="tab" data-tab="equip">🛡</button>
      <button class="tab" data-tab="settings">⚙</button>
    </div>
    <div id="panel"></div>
  </aside>
</div>

<script>
(() => {

/* =========================================================

const hpOrb = document.getElementById("hpOrb");

  [T.wall]:"#77766f",
  [T.door]:"#6b3a18",
  [T.stone]:"#595b58",

const LANDMARKS = {

  grandExchange:   {name:"Grand Exchange", x:184, y:82,  w:94, h:72},

/* =========================================================

========================================================= */
const ground = new Uint8Array(WORLD.W * WORLD.H);

/* =========================================================
   UTIL
========================================================= */
function idx(x,y){return y*WORLD.W+x;}
function inb(x,y){return x>=0&&y>=0&&x<WORLD.W&&y<WORLD.H;}
function setTile(x,y,t,block=false,rid=0){if(!inb(x,y))return;ground[idx(x,y)]=t;solid[idx(x,y)]=block?1:0;if(rid)region[idx(x,y)]=rid;}
function getTile(x,y){return inb(x,y)?ground[idx(x,y)]:T.water;}
function isSolid(x,y){return !inb(x,y)||solid[idx(x,y)]===1;}
function rect(x,y,w,h,t,block=false,rid=0){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)setTile(xx,yy,t,block,rid);}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function log(text,cls="system"){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;}
function within(x,y,o){return x>=o.x&&y>=o.y&&x<o.x+o.w&&y<o.y+o.h;}
function nearPlayer(o,range=WORLD.render){const cx=o.x+(o.w||1)/2,cy=o.y+(o.h||1)/2;return Math.abs(cx-player.x)<=range&&Math.abs(cy-player.y)<=range;}
function dirBetween(a,b){if(b.x>a.x)return"right";if(b.x<a.x)return"left";if(b.y>a.y)return"down";if(b.y<a.y)return"up";return player.dir;}
function addObj(o){objects.push(o);return o;}
function addItem(name,x,y,qty=1){items.push({name,x,y,rx:x,ry:y,qty});}
function addEnt(e){entities.push(Object.assign({rx:e.x,ry:e.y,dir:"down",hp:e.hp||10,maxHp:e.hp||10,cooldown:0,hostile:false,hitbox:34,labelZ:36},e));}

/* =========================================================
   MAP BUILDING
========================================================= */
function addBuilding(name,x,y,w,h,kind="house",doors=[]){
  rect(x,y,w,h,T.floor,false);
  for(let xx=x;xx<x+w;xx++){setTile(xx,y,T.wall,true);setTile(xx,y+h-1,T.wall,true);}
  for(let yy=y;yy<y+h;yy++){setTile(x,yy,T.wall,true);setTile(x+w-1,yy,T.wall,true);}
  for(const [dx,dy] of doors){setTile(x+dx,y+dy,T.door,false);}
  addObj({type:"building",kind,name,x,y,w,h,doors});
}

function addCityWall(name,x,y,w,h,doors=[]){
  for(let xx=x;xx<x+w;xx++){setTile(xx,y,T.wall,true);setTile(xx,y+h-1,T.wall,true);}
  for(let yy=y;yy<y+h;yy++){setTile(x,yy,T.wall,true);setTile(x+w-1,yy,T.wall,true);}
  for(const [dx,dy,dw,dh] of doors)rect(x+dx,y+dy,dw,dh,T.door,false);
  addObj({type:"wallring",name,x,y,w,h,doors});
}

function road(points,width=5,t=T.road){
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1],dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y);
    let x=a.x,y=a.y;
    while(x!==b.x||y!==b.y){
      rect(x-Math.floor(width/2),y-Math.floor(width/2),width,width,t,false);
      if(x!==b.x)x+=dx;
      if(y!==b.y)y+=dy;
    }
  }
}

function river(points,width=12){
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1],steps=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y));
    for(let s=0;s<=steps;s++){
      const x=Math.round(a.x+(b.x-a.x)*s/steps);
      const y=Math.round(a.y+(b.y-a.y)*s/steps);
      rect(x-Math.floor(width/2),y-Math.floor(width/2),width,width,T.water,true);
    }
  }
}

function scatterTrees(area,count,dense=false){
  for(let i=0;i<count;i++){
    const x=rand(area.x,area.x+area.w-1),y=rand(area.y,area.y+area.h-1);
    if(getTile(x,y)!==T.grass&&getTile(x,y)!==T.forest)continue;
    if(isSolid(x,y))continue;
    setTile(x,y,dense?T.forest:T.grass,false);
    addObj({type:"tree",name:"Tree",x,y,w:1,h:1});
    solid[idx(x,y)]=1;
  }
}

  // Al Kharid / desert edge

    "Misthalin":{bpm:88,lead:["C4","E4","G4","A4","G4","E4"],bass:["C2","G2","A2","F2"]}

};
const NOTE = {"C1":32.7,"D1":36.7,"E1":41.2,"F1":43.7,"G1":49,"A1":55,"Bb2":116.5,"C2":65.4,"D2":73.4,"E2":82.4,"F2":87.3,"G2":98,"A2":110,"C3":130.8,"D3":146.8,"E3":164.8,"F3":174.6,"G3":196,"A3":220,"B3":246.9,"C4":261.6,"D4":293.7,"E4":329.6,"F4":349.2,"G4":392,"A4":440,"B4":493.9,"C5":523.3,"D5":587.3};
function initAudio(){
  if(AudioSys.ctx||!state.audio)return;
  AudioSys.ctx = new (window.AudioContext||window.webkitAudioContext)();
  musicStarted = true;
}
function tone(note,dur=0.1,type="square",vol=0.08){
  if(!state.audio||!AudioSys.ctx)return;
  const ac=AudioSys.ctx,osc=ac.createOscillator(),gain=ac.createGain();
  osc.type=type;osc.frequency.value=NOTE[note]||note||220;
  gain.gain.setValueAtTime(0,ac.currentTime);
  gain.gain.linearRampToValueAtTime(vol,ac.currentTime+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  osc.connect(gain).connect(ac.destination);osc.start();osc.stop(ac.currentTime+dur);
}
function noise(dur=0.05,vol=0.08){
  if(!state.audio||!AudioSys.ctx)return;
  const ac=AudioSys.ctx,buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
  const src=ac.createBufferSource(),gain=ac.createGain();
  src.buffer=buf;gain.gain.value=vol;src.connect(gain).connect(ac.destination);src.start();
}
function sfx(name){
  if(name==="click")tone("G4",0.04,"square",0.05);
  if(name==="step")tone("C2",0.025,"triangle",0.025);
  if(name==="hit"){noise(0.04,0.07);tone("C3",0.06,"square",0.08);}
  if(name==="death"){tone("D3",0.09,"sawtooth",0.08);setTimeout(()=>tone("A2",0.12,"sawtooth",0.07),80);}
}
function musicZone(){
  if(within(player.x,player.y,LANDMARKS.grandExchange))return"Grand Exchange";
  if(within(player.x,player.y,LANDMARKS.varrock))return"Varrock";
  if(within(player.x,player.y,LANDMARKS.lumbridge)||within(player.x,player.y,LANDMARKS.lumbridgeCastle))return"Lumbridge";
  if(within(player.x,player.y,LANDMARKS.lumbridgeSwamp))return"Swamp";
  if(within(player.x,player.y,LANDMARKS.desert)||within(player.x,player.y,LANDMARKS.alKharid))return"Desert";
  return"Misthalin";

function setMusic(track){
  currentMusic=track;songOrb.textContent=track.slice(0,8);
  if(!state.music||!AudioSys.ctx)return;
  if(AudioSys.musicTimer)clearInterval(AudioSys.musicTimer);
  const tr=AudioSys.tracks[track],beat=60000/tr.bpm/2;
  AudioSys.step=0;
  AudioSys.musicTimer=setInterval(()=>{
    if(!state.music||!AudioSys.ctx)return;
    const i=AudioSys.step++;
    tone(tr.lead[i%tr.lead.length],beat/1000*0.72,"square",0.035);
    if(i%2===0)tone(tr.bass[Math.floor(i/2)%tr.bass.length],beat/1000*1.4,"triangle",0.035);
  },beat);
}

/* =========================================================
   PATHFINDING
========================================================= */
function passable(x,y){
  if(!inb(x,y))return false;
  if(isSolid(x,y))return false;
  const t=getTile(x,y);
  return t!==T.water && t!==T.wall;
}
function h(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);}
function reconstruct(came,cur,sx,sy){
  const out=[];
  while(!(cur.x===sx&&cur.y===sy)){
    out.push({x:cur.x,y:cur.y});
    cur=came.get(cur.x+","+cur.y);
    if(!cur)break;
  }
  return out.reverse();
}
function findPath(sx,sy,gx,gy){
  if(!passable(gx,gy)){
    const alt=nearestPassable(gx,gy);
    if(!alt)return[];
    gx=alt.x;gy=alt.y;
  }
  const open=[{x:sx,y:sy,g:0,f:h({x:sx,y:sy},{x:gx,y:gy})}],came=new Map(),gscore=new Map([[sx+","+sy,0]]),closed=new Set(),goal=gx+","+gy;
  let loops=0;
  while(open.length&&loops++<22000){
    open.sort((a,b)=>a.f-b.f);
    const cur=open.shift(),ck=cur.x+","+cur.y;
    if(ck===goal)return reconstruct(came,cur,sx,sy);
    if(closed.has(ck))continue;
    closed.add(ck);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cur.x+dx,ny=cur.y+dy,nk=nx+","+ny;
      if(!passable(nx,ny)||closed.has(nk))continue;
      const ng=cur.g+1;
      if(ng<(gscore.get(nk)??1e9)){
        came.set(nk,cur);gscore.set(nk,ng);
        open.push({x:nx,y:ny,g:ng,f:ng+h({x:nx,y:ny},{x:gx,y:gy})});
      }
    }
  }
  return[];
}
function nearestPassable(gx,gy){
  for(let r=1;r<=8;r++){
    const opts=[];
    for(let y=gy-r;y<=gy+r;y++)for(let x=gx-r;x<=gx+r;x++){
      if(Math.abs(x-gx)!==r&&Math.abs(y-gy)!==r)continue;
      if(passable(x,y))opts.push({x,y,d:Math.abs(x-gx)+Math.abs(y-gy)});
    }
    opts.sort((a,b)=>a.d-b.d);
    if(opts.length)return opts[0];
  }
  return null;
}
function pathToAdjacent(e){
  const opts=[];
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(passable(e.x+dx,e.y+dy))opts.push({x:e.x+dx,y:e.y+dy});
  opts.sort((a,b)=>h(player,a)-h(player,b));
  for(const o of opts){const p=findPath(player.x,player.y,o.x,o.y);if(p.length)return p;}
  return[];
}
function setDestination(x,y){
  player.combatTarget=null;
  const p=findPath(player.x,player.y,x,y);
  if(!p.length){log("I can't reach that.");sfx("click");return;}
  path=p;sfx("click");
}

/* =========================================================
   COMBAT
========================================================= */
function getEntity(id){return entities.find(e=>e.id===id&&e.hp>0);}
function adjacent(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)<=1;}
function startCombat(e){
  if(!e.hostile){setDestination(e.x,e.y);return;}
  player.combatTarget=e.id;
  if(!adjacent(player,e))path=pathToAdjacent(e);
  log("Attacking "+e.name+".","combat");
  sfx("click");
}
function combatTick(){
  if(!player.combatTarget)return;
  const e=getEntity(player.combatTarget);
  if(!e){player.combatTarget=null;return;}
  if(!adjacent(player,e)){
    if(!path.length)path=pathToAdjacent(e);
    return;
  }
  player.dir=dirBetween(player,e);
  if(player.cooldown>0){player.cooldown--;return;}
  const hit=Math.random()<0.72?rand(0,Math.max(1,player.attack+1)):0;
  e.hp=Math.max(0,e.hp-hit);
  log("You hit the "+e.name+" for "+hit+".","combat");
  sfx("hit");
  player.cooldown=4;
  if(e.hp<=0){
    log(e.name+" dies.","loot");
    addItem("Bones",e.x,e.y);
    sfx("death");
    player.combatTarget=null;
    return;
  }
  if(e.hostile){
    const dmg=Math.random()<0.55?rand(0,e.attack||1):0;
    player.hp=Math.max(0,player.hp-dmg);
    if(dmg)log(e.name+" hits you for "+dmg+".","combat");
    if(player.hp<=0){
      log("You collapse and wake up in Lumbridge.","combat");
      Object.assign(player,{x:382,y:572,rx:382,ry:572,hp:player.maxHp,combatTarget:null});
      path=[];
    }
  }
}

function resize(){
  const r=game.parentElement.getBoundingClientRect();
  for(const c of [game,labels]){c.width=Math.floor(r.width);c.height=Math.floor(r.height);}
  const mr=mini.parentElement.getBoundingClientRect();
  mini.width=Math.floor(mr.width);mini.height=Math.floor(mr.height);
}
window.addEventListener("resize",resize);
resize();

function worldToScreen(x,y,z=0){
  const tw=WORLD.tileW*cam.zoom,th=WORLD.tileH*cam.zoom;
  return {
    x:(x-y)*tw/2 + game.width/2 + cam.x,
    y:(x+y)*th/2 + cam.y - z*cam.zoom
  };
}
function screenToWorld(sx,sy){
  const tw=WORLD.tileW*cam.zoom,th=WORLD.tileH*cam.zoom;
  const X=sx-game.width/2-cam.x,Y=sy-cam.y;
  const x=Math.floor(Y/th + X/tw);
  const y=Math.floor(Y/th - X/tw);
  return {x,y};
}
function poly(points,fill,stroke="#00000055"){
  ctx.beginPath();
  ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
}
function tileDiamond(x,y,color){
  const p=worldToScreen(x,y,0),tw=WORLD.tileW*cam.zoom,th=WORLD.tileH*cam.zoom;
  poly([{x:p.x,y:p.y-th/2},{x:p.x+tw/2,y:p.y},{x:p.x,y:p.y+th/2},{x:p.x-tw/2,y:p.y}],color,null);
}
function cubeIso(x,y,z,w,h,d,color,outline=true){
  const a=worldToScreen(x,y,z),b=worldToScreen(x+w,y,z),c=worldToScreen(x+w,y+h,z),d0=worldToScreen(x,y+h,z);
  const az=worldToScreen(x,y,z+d),bz=worldToScreen(x+w,y,z+d),cz=worldToScreen(x+w,y+h,z+d),dz=worldToScreen(x,y+h,z+d);
  poly([az,bz,cz,dz],color,outline?"#0008":null);
  poly([d0,c,cz,dz],shadeHex(color,.72),outline?"#0008":null);
  poly([b,c,cz,bz],shadeHex(color,.58),outline?"#0008":null);
}
function shadeHex(hex,f){
  const n=parseInt(hex.slice(1),16),r=Math.min(255,((n>>16)&255)*f),g=Math.min(255,((n>>8)&255)*f),b=Math.min(255,(n&255)*f);
  return `rgb(${r|0},${g|0},${b|0})`;
}
function drawTriangleMarker(x,y,z,color){
  const p=worldToScreen(x+.5,y+.5,z);
  poly([{x:p.x,y:p.y-16*cam.zoom},{x:p.x+10*cam.zoom,y:p.y+8*cam.zoom},{x:p.x-10*cam.zoom,y:p.y+8*cam.zoom}],color,"#0008");
}

function drawSpecialObj(o){

    for(let i=0;i<12;i++){const a=i/12*Math.PI*2;cubeIso(o.x+o.w/2+Math.cos(a)*32,o.y+o.h/2+Math.sin(a)*22,0,2,2,22,"#8d8c85");}
    return;
  }
  if(o.type==="fountain"){cubeIso(o.x,o.y,0,o.w,o.h,8,"#777");drawTriangleMarker(o.x+2,o.y+2,20,"#79bde8");return;}

  if(o.type==="post"){cubeIso(o.x,o.y,0,1,1,18,"#8d8c85");return;}
  if(o.type==="gate"||o.type==="node"||o.type==="cave"){cubeIso(o.x,o.y,0,o.w,o.h,10,"#4e3a22");return;}
}

  cubeIso(x+.12,y+.18,43,.20,.22,18,"#b98655");
  cubeIso(x+.88,y+.18,43,.20,.22,18,"#b98655");
  cubeIso(x+.36,y+.18,58,.34,.34,14,"#b98655");
  cubeIso(x+.40,y+.08,70,.26,.22,6,"#2a1a08");
}
function drawGoblin(e){
  const x=e.rx,y=e.ry;
  cubeIso(x+.25,y+.25,0,.28,.28,8,"#211308");
  cubeIso(x+.58,y+.25,0,.28,.28,8,"#211308");
  cubeIso(x+.24,y+.20,12,.55,.55,22,"#563818");
  cubeIso(x+.12,y+.18,34,.20,.20,22,"#4ca943");
  cubeIso(x+.88,y+.18,34,.20,.20,22,"#4ca943");
  cubeIso(x+.30,y+.12,55,.46,.42,18,"#4ca943");
  cubeIso(x+.16,y+.20,64,.18,.08,6,"#4ca943");
  cubeIso(x+.78,y+.20,64,.18,.08,6,"#4ca943");
}
function drawAnimal(e){
  const x=e.rx,y=e.ry,s=e.species;
  if(s==="Cow"){cubeIso(x+.05,y+.18,12,1.05,.62,22,"#d8d2bd");cubeIso(x+.86,y+.22,24,.38,.34,16,"#d8d2bd");cubeIso(x+.2,y+.1,18,.25,.08,8,"#422819");}
  else if(s==="Chicken"){cubeIso(x+.25,y+.25,8,.45,.38,18,"#e8dc86");cubeIso(x+.62,y+.30,22,.20,.18,10,"#e8dc86");drawTriangleMarker(x+.76,y+.39,34,"#e87512");}
  else if(s==="Sheep"){cubeIso(x+.1,y+.18,10,.85,.62,22,"#d8d5c8");cubeIso(x+.82,y+.28,24,.32,.26,14,"#30251b");}
  else if(s==="Rat"){cubeIso(x+.20,y+.35,5,.60,.30,10,"#696157");cubeIso(x+.75,y+.38,11,.22,.18,8,"#696157");}
  else if(s==="Giant spider"){cubeIso(x+.15,y+.25,8,.74,.55,12,"#171513");for(let i=0;i<4;i++){cubeIso(x+.08+i*.22,y-.10,8,.08,.42,5,"#171513");cubeIso(x+.08+i*.22,y+.70,8,.08,.42,5,"#171513");}}
}
function drawEntity(e){
  if(e.id==="player")return drawHuman(e,true);
  if(e.role==="animal")return drawAnimal(e);
  if(e.name==="Goblin")return drawGoblin(e);
  if(e.name==="Restless ghost"){cubeIso(e.rx+.25,e.ry+.20,12,.55,.55,34,"#aeeaff");return;}
  drawHuman(e,false);
}

/* =========================================================
   LABELS / HOVER
========================================================= */
function drawLabels(visible){
  lctx.clearRect(0,0,labels.width,labels.height);
  hoverEntity=null;
  for(const e of visible){
    if(Math.abs(e.x-player.x)>WORLD.labelRender||Math.abs(e.y-player.y)>WORLD.labelRender)continue;
    const p=worldToScreen(e.rx+.5,e.ry+.5,92);
    if(p.x<-80||p.y<-60||p.x>labels.width+80||p.y>labels.height+80)continue;
    e.hoverBox={x:p.x-42,y:p.y-44,w:84,h:62};
    if(mouse.x>=e.hoverBox.x&&mouse.x<=e.hoverBox.x+e.hoverBox.w&&mouse.y>=e.hoverBox.y&&mouse.y<=e.hoverBox.y+e.hoverBox.h)hoverEntity=e;

    lctx.font="bold 12px Georgia";
    lctx.textAlign="center";
    lctx.lineWidth=3;
    lctx.strokeStyle="#000";
    lctx.fillStyle=e.hostile?"#ffdd66":"#fff2a8";
    lctx.strokeText(e.name,p.x,p.y);
    lctx.fillText(e.name,p.x,p.y);

    if(state.renderBoxes){
      lctx.strokeStyle="#ff0";
      lctx.strokeRect(e.hoverBox.x,e.hoverBox.y,e.hoverBox.w,e.hoverBox.h);
    }
  }
}

/* =========================================================
   MINIMAP
========================================================= */
function drawMini(){
  const sx=mini.width/WORLD.W,sy=mini.height/WORLD.H;
  mctx.clearRect(0,0,mini.width,mini.height);
  for(let y=0;y<WORLD.H;y+=3)for(let x=0;x<WORLD.W;x+=3){
    mctx.fillStyle=COLOR[getTile(x,y)];
    mctx.fillRect(x*sx,y*sy,Math.ceil(3*sx),Math.ceil(3*sy));
  }
  for(const e of entities){
    if(e.hp<=0)continue;
    mctx.fillStyle=e.hostile?"#f33":"#ff5";
    mctx.fillRect(e.x*sx-1,e.y*sy-1,3,3);
  }
  mctx.fillStyle="#0ff";
  mctx.fillRect(player.x*sx-2,player.y*sy-2,5,5);
  mctx.strokeStyle="#fff";
  mctx.strokeRect((player.x-WORLD.render)*sx,(player.y-WORLD.render)*sy,WORLD.render*2*sx,WORLD.render*2*sy);
}

/* =========================================================
   RENDER LOOP
========================================================= */
const mouse={x:0,y:0,down:false};

function updateStep(now){
  if(path.length&&now-lastStep>WORLD.stepMs){
    lastStep=now;
    const n=path.shift();
    player.dir=dirBetween(player,n);
    player.x=n.x;player.y=n.y;
    sfx("step");
  }
  player.rx+=(player.x-player.rx)*.28;
  player.ry+=(player.y-player.ry)*.28;
  for(const e of entities){e.rx+=(e.x-e.rx)*.18;e.ry+=(e.y-e.ry)*.18;}
}

function drawFrame(now=0){
  tick++;
  updateStep(now);

  const mz=musicZone();
  if(mz!==currentMusic)setMusic(mz);

  ctx.clearRect(0,0,game.width,game.height);

  const minX=Math.max(0,player.x-WORLD.render),maxX=Math.min(WORLD.W,player.x+WORLD.render);
  const minY=Math.max(0,player.y-WORLD.render),maxY=Math.min(WORLD.H,player.y+WORLD.render);

  for(let y=minY;y<maxY;y++){
    for(let x=minX;x<maxX;x++){
      const t=getTile(x,y);
      if(t===T.wall)drawWallTile(x,y);
      else if(t===T.door)drawDoorTile(x,y);
      else tileDiamond(x,y,COLOR[t]);
    }
  }

  const visibleObjects=objects.filter(o=>nearPlayer(o,WORLD.render));
  visibleObjects.sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  for(const o of visibleObjects)drawSpecialObj(o);

  for(const it of items){
    if(Math.abs(it.x-player.x)>WORLD.render||Math.abs(it.y-player.y)>WORLD.render)continue;
    cubeIso(it.rx+.25,it.ry+.25,8,.5,.5,6,"#d9b858");
  }

  const visibleEntities=entities.filter(e=>e.hp>0&&Math.abs(e.x-player.x)<=WORLD.entityRender&&Math.abs(e.y-player.y)<=WORLD.entityRender);
  visibleEntities.push(Object.assign({id:"player",rx:player.rx,ry:player.ry,x:player.x,y:player.y,name:"You",color:player.color},player));
  visibleEntities.sort((a,b)=>(a.rx+a.ry)-(b.rx+b.ry));
  for(const e of visibleEntities)drawEntity(e);

  drawLabels(visibleEntities.filter(e=>e.id!=="player"));
  drawMini();
  updateHud();
  requestAnimationFrame(drawFrame);
}

/* =========================================================
   INPUT
========================================================= */
function worldClick(x,y){
  initAudio();
  if(hoverEntity){
    if(hoverEntity.hostile)startCombat(hoverEntity);
    else {
      log("You approach "+hoverEntity.name+".");
      path = findPath(player.x,player.y,hoverEntity.x,hoverEntity.y);
    }
    return;
  }
  setDestination(x,y);
}

game.addEventListener("mousemove",e=>{
  const r=game.getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
  hoverTile=screenToWorld(mouse.x,mouse.y);
  if(hoverEntity)hud.textContent=hoverEntity.hostile?"Attack "+hoverEntity.name:"Talk-to "+hoverEntity.name;
  else hud.textContent=inb(hoverTile.x,hoverTile.y)?"Walk here":"";
});
labels.addEventListener("mousemove",e=>{
  const r=labels.getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
});
labels.addEventListener("click",e=>{
  const r=labels.getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
  const w=screenToWorld(mouse.x,mouse.y);
  worldClick(w.x,w.y);
});
game.addEventListener("click",e=>{
  const r=game.getBoundingClientRect();
  const w=screenToWorld(e.clientX-r.left,e.clientY-r.top);
  worldClick(w.x,w.y);
});
game.addEventListener("mousedown",e=>{cam.drag=true;cam.sx=e.clientX;cam.sy=e.clientY;cam.cx=cam.x;cam.cy=cam.y;});
window.addEventListener("mouseup",()=>cam.drag=false);
window.addEventListener("mousemove",e=>{
  if(cam.drag){cam.x=cam.cx+e.clientX-cam.sx;cam.y=cam.cy+e.clientY-cam.sy;}
});
game.addEventListener("wheel",e=>{
  e.preventDefault();
  cam.zoom=Math.max(.45,Math.min(2.0,cam.zoom+(e.deltaY<0?.08:-.08)));
},{passive:false});
mini.addEventListener("click",e=>{
  initAudio();
  const r=mini.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*WORLD.W);
  const y=Math.floor((e.clientY-r.top)/r.height*WORLD.H);
  setDestination(x,y);
});
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="arrowup")setDestination(player.x,player.y-1);
  if(k==="arrowdown")setDestination(player.x,player.y+1);
  if(k==="arrowleft")setDestination(player.x-1,player.y);
  if(k==="arrowright")setDestination(player.x+1,player.y);
  if(k===" ")player.combatTarget?player.combatTarget=null:hoverEntity&&startCombat(hoverEntity);
});

/* =========================================================
   COMBAT LOOP / UI
========================================================= */
setInterval(combatTick,WORLD.combatTickMs);

function locName(){
  for(const k of Object.keys(LANDMARKS)){
    const l=LANDMARKS[k];
    if(within(player.x,player.y,l))return l.name;
  }
  return "Kingdom of Misthalin";
}
function updateHud(){
  locPill.textContent=locName();
  targetPill.textContent=player.combatTarget?(getEntity(player.combatTarget)?.name||"No target"):(hoverEntity?hoverEntity.name:"No target");
  hpOrb.textContent=`HP ${player.hp}/${player.maxHp}`;
  runOrb.textContent=`Run ${Math.floor(player.run)}`;
}
function updatePanel(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));
  if(state.tab==="combat"){
    panel.innerHTML=`<div class="title">Combat</div>
      <div class="row"><span>Weapon</span><strong>${player.weapon}</strong></div>
      <div class="row"><span>Target</span><strong>${player.combatTarget?(getEntity(player.combatTarget)?.name||"-"):"-"}</strong></div>
      <button id="stopCombat" style="width:100%">Stop combat</button>`;
    document.getElementById("stopCombat").onclick=()=>{player.combatTarget=null;};
  } else if(state.tab==="map"){
    panel.innerHTML=`<div class="title">Misthalin Atlas</div>
      ${Object.values(LANDMARKS).map(l=>`<button data-x="${l.x+l.w/2}" data-y="${l.y+l.h/2}" style="width:100%;margin:2px 0">${l.name}</button>`).join("")}`;
    panel.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>setDestination(+b.dataset.x|0,+b.dataset.y|0));
  } else if(state.tab==="inv"){
    panel.innerHTML=`<div class="title">Inventory</div><div class="gridInv">${
      Array.from({length:28},(_,i)=>state.inv[i]).map((it,i)=>`<div class="slot" data-i="${i}">${it?it.name:""}${it&&it.qty>1?`<span class="qty">${it.qty}</span>`:""}</div>`).join("")
    }</div>`;
    panel.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{const it=state.inv[+s.dataset.i];if(it&&it.name==="Bread"){player.hp=Math.min(player.maxHp,player.hp+5);it.qty--;if(it.qty<=0)state.inv.splice(+s.dataset.i,1);log("You eat the bread.","loot");updatePanel();}});
  } else if(state.tab==="equip"){
    panel.innerHTML=`<div class="title">Equipment</div><div class="row"><span>Weapon</span><strong>${player.weapon}</strong></div>`;
  } else {
    panel.innerHTML=`<div class="title">Settings</div>
      <button id="audioBtn" style="width:100%">Audio: ${state.audio?"ON":"OFF"}</button>
      <button id="musicBtn" style="width:100%;margin-top:4px">Music: ${state.music?"ON":"OFF"}</button>
      <button id="boxBtn" style="width:100%;margin-top:4px">Hover boxes: ${state.renderBoxes?"ON":"OFF"}</button>
      <button id="resetBtn" style="width:100%;margin-top:4px">Reset position</button>
      <p style="color:var(--muted)">All living characters use angular geometry. Trees, props, buildings, and NPCs are culled outside render distance.</p>`;
    document.getElementById("audioBtn").onclick=()=>{state.audio=!state.audio;updatePanel();};
    document.getElementById("musicBtn").onclick=()=>{state.music=!state.music;if(!state.music&&AudioSys.musicTimer)clearInterval(AudioSys.musicTimer);else initAudio();updatePanel();};
    document.getElementById("boxBtn").onclick=()=>{state.renderBoxes=!state.renderBoxes;updatePanel();};
    document.getElementById("resetBtn").onclick=()=>{Object.assign(player,{x:382,y:572,rx:382,ry:572,hp:10,combatTarget:null});path=[];};
  }
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;updatePanel();});
document.getElementById("btnTalk").onclick=()=>{if(hoverEntity&&!hoverEntity.hostile)log(hoverEntity.name+": Hello there.");else log("There is no one nearby to talk to.");};
document.getElementById("btnAttack").onclick=()=>{if(hoverEntity&&hoverEntity.hostile)startCombat(hoverEntity);else log("Hover a hostile NPC first.");};
document.getElementById("btnUse").onclick=()=>log("You look for something to use.");
document.getElementById("btnSearch").onclick=()=>log("You search around "+locName()+".");
document.getElementById("btnBank").onclick=()=>{state.tab="inv";updatePanel();log("Banking interface placeholder opened.");};
document.getElementById("btnSave").onclick=()=>log("This prototype uses runtime state only.");

/* =========================================================
   BOOT
========================================================= */
buildWorld();
buildEntities();
updatePanel();
log("Welcome to the Misthalin atlas build.","system");
log("Click the world or minimap to walk. Hover NPCs to see names. Click hostile NPCs to auto-attack on combat ticks.","system");
log("Audio starts after first click and uses original generated MIDI-like tracks.","system");
resize();
requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
