<!DOCTYPE html>
<html lang="en">
<head>

<title>Irondale – Classic Browser RPG (Isometric 2D)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Segoe UI',monospace;user-select:none;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw;}
#game-wrapper{position:relative;width:765px;height:503px;background:#000;border:2px solid #3a2a1a;}
#game-canvas{display:block;width:765px;height:503px;}
#hud{position:absolute;top:0;left:0;width:765px;height:503px;pointer-events:none;overflow:hidden;}
#loading-screen{position:absolute;inset:0;background:#0a0500;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-spinner{width:32px;height:32px;border:3px solid #3a2a1a;border-top-color:#c5a028;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
#loading-screen h1{color:#c5a028;font-family:Georgia,serif;font-size:48px;text-shadow:0 0 20px #c5a028,0 0 40px #8a6a10;letter-spacing:4px;}
#loading-screen .sub{color:#8a6a3a;font-size:14px;margin:8px 0 24px;font-style:italic;}
#load-bar-outer{width:300px;height:20px;border:1px solid #5a4a2a;background:#0a0500;border-radius:2px;}
#load-bar{height:100%;background:linear-gradient(90deg,#8a6a10,#c5a028);width:0%;transition:width 0.3s;border-radius:1px;}
#load-status{color:#8a6a3a;font-size:12px;margin-top:8px;}
#top-bar{position:absolute;top:0;left:0;right:160px;height:24px;background:rgba(0,0,0,0.8);border-bottom:1px solid #3a2a1a;display:flex;align-items:center;padding:0 8px;gap:12px;font-size:11px;font-family:monospace;pointer-events:auto;color:#ff981f;z-index:10;}
#top-bar .title{color:#c5a028;font-weight:bold;letter-spacing:1px;}
#top-bar span{color:#aaa;}
#top-bar .val{color:#fff;}
#minimap-wrap{position:absolute;top:0;right:0;width:160px;height:160px;background:#0a0a05;border:2px solid #5a4a2a;border-top:none;border-right:none;pointer-events:auto;cursor:crosshair;z-index:10;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#minimap{width:152px;height:152px;}
.data-orb{position:absolute;left:3px;width:52px;height:52px;border-radius:50%;border:2px solid #5a4a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-family:monospace;font-weight:bold;cursor:pointer;pointer-events:auto;z-index:10;}
#hp-orb{top:160px;background:radial-gradient(circle,#4a0000 0%,#1a0000 100%);color:#ff4444;}
#prayer-orb{top:216px;background:radial-gradient(circle,#001a4a 0%,#000a1a 100%);color:#44aaff;}
#run-orb{top:272px;background:radial-gradient(circle,#1a3a00 0%,#0a1a00 100%);color:#88ff44;}
.orb-icon{font-size:14px;line-height:1;}
.orb-val{font-size:10px;line-height:1;}
#chatbox{position:absolute;bottom:0;left:0;width:519px;height:142px;background:rgba(0,0,0,0.88);border-top:1px solid #3a2a1a;display:flex;flex-direction:column;pointer-events:auto;z-index:10;}
#chat-tabs{display:flex;height:20px;background:#0a0500;border-bottom:1px solid #3a2a1a;flex-shrink:0;}
.chat-tab{flex:1;background:#1a0f05;color:#ff981f;font-size:10px;cursor:pointer;border-right:1px solid #3a2a1a;text-align:center;padding-top:3px;font-family:monospace;}
.chat-tab.active{background:#2a1a0a;color:#fff;}
#chat-messages{flex:1;overflow-y:auto;padding:2px 4px;font-size:11px;font-family:monospace;scrollbar-width:thin;scrollbar-color:#3a2a1a #0a0500;}
#chat-messages::-webkit-scrollbar{width:6px;}
#chat-messages::-webkit-scrollbar-track{background:#0a0500;}
#chat-messages::-webkit-scrollbar-thumb{background:#3a2a1a;}
.chat-msg{padding:1px 0;line-height:1.3;}
.chat-game{color:#ff981f;}.chat-player{color:#00ffff;}.chat-quest{color:#9f4fff;}.chat-combat{color:#ff4444;}.chat-item{color:#00ff00;}.chat-skill{color:#ffff00;}
#chat-input-bar{height:22px;display:flex;background:#0a0a0a;border-top:1px solid #3a2a1a;flex-shrink:0;}
#chat-input{flex:1;background:transparent;border:none;color:#ffff00;font-size:11px;font-family:monospace;padding:0 4px;outline:none;}
#right-panel{position:absolute;right:0;bottom:0;width:196px;height:303px;background:rgba(15,10,5,0.95);border-left:1px solid #5a4a2a;border-top:1px solid #5a4a2a;display:flex;flex-direction:column;pointer-events:auto;z-index:10;}
#panel-tabs{display:flex;height:30px;background:#0a0500;border-bottom:1px solid #3a2a1a;flex-shrink:0;}
.panel-tab{flex:1;display:flex;align-items:center;justify-content:center;background:#1a0f05;color:#ff981f;font-size:13px;cursor:pointer;border-right:1px solid #2a1a0a;transition:background 0.15s;}
.panel-tab.active{background:#2a1a0a;color:#fff;}
.panel-tab:hover{background:#2a1a0a;}
#panel-content{flex:1;overflow-y:auto;padding:4px;scrollbar-width:thin;scrollbar-color:#3a2a1a #0a0500;}
#panel-content::-webkit-scrollbar{width:5px;}
#panel-content::-webkit-scrollbar-track{background:#0a0500;}
#panel-content::-webkit-scrollbar-thumb{background:#3a2a1a;}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
.inv-slot{width:44px;height:34px;background:#0a0500;border:1px solid #3a2a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:8px;color:#ff981f;text-align:center;overflow:hidden;transition:border-color 0.15s;}
.inv-slot:hover{border-color:#ff981f;}
.inv-slot .item-icon{width:32px;height:26px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;text-shadow:0 0 2px #000;font-weight:bold;}
.inv-slot .stack-count{position:absolute;bottom:1px;left:2px;font-size:8px;color:#ffff00;font-weight:bold;text-shadow:1px 1px 0 #000;}
.skill-row{display:flex;align-items:center;padding:2px 4px;font-size:10px;font-family:monospace;border-bottom:1px solid #1a1208;}
.skill-row .sk-icon{width:16px;text-align:center;margin-right:4px;}
.skill-row .sk-name{flex:1;color:#ff981f;}
.skill-row .sk-lvl{color:#fff;min-width:30px;text-align:right;}
.quest-item{padding:4px;cursor:pointer;font-size:11px;font-family:monospace;border-bottom:1px solid #1a1208;}
.quest-item .q-name{font-weight:bold;}
.q-not_started .q-name{color:#ff0000;}
.q-in_progress .q-name{color:#ffff00;}
.q-complete .q-name{color:#00ff00;}
.quest-obj{font-size:10px;color:#aaa;padding-left:12px;margin-top:2px;}
.quest-obj.done{color:#00ff00;text-decoration:line-through;}
.combat-styles{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;}
.style-btn{padding:6px;background:#1a0f05;border:1px solid #3a2a1a;color:#ff981f;font-size:10px;font-family:monospace;cursor:pointer;text-align:center;border-radius:2px;}
.style-btn.active{background:#2a1a0a;border-color:#c5a028;color:#fff;}
.style-btn:hover{border-color:#ff981f;}
.equip-grid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;}
.equip-row{display:flex;gap:2px;}
.equip-slot{width:40px;height:34px;background:#0a0500;border:1px solid #3a2a1a;display:flex;align-items:center;justify-content:center;font-size:7px;color:#555;cursor:pointer;text-align:center;}
.equip-slot.filled{color:#ff981f;border-color:#5a4a2a;}
#context-menu{position:absolute;display:none;background:#1a1208;border:1px solid #5a4a2a;min-width:130px;z-index:1000;pointer-events:auto;font-size:12px;font-family:monospace;}
.ctx-option{padding:4px 10px;color:#ff981f;cursor:pointer;}
.ctx-option:first-child{color:#ffff00;background:#0a0500;cursor:default;font-weight:bold;font-size:11px;}
.ctx-option:not(:first-child):hover{background:#2a1a0a;color:#fff;}
#dialog-panel{position:absolute;bottom:142px;left:0;width:519px;background:rgba(0,0,0,0.94);border:1px solid #5a4a2a;border-bottom:none;border-left:none;padding:10px;pointer-events:auto;display:none;z-index:20;}
#dialog-name{color:#ffff00;font-size:13px;font-weight:bold;margin-bottom:6px;font-family:monospace;}
#dialog-text{color:#fff;font-size:12px;margin-bottom:10px;line-height:1.5;font-family:monospace;}
#dialog-options{display:flex;flex-direction:column;gap:3px;}
.dialog-option{color:#00ffff;font-size:11px;cursor:pointer;padding:2px 0;font-family:monospace;}
.dialog-option:hover{color:#ffffff;}
.dialog-option::before{content:'▶ ';}
#bank-modal{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:none;z-index:100;pointer-events:auto;flex-direction:column;align-items:center;justify-content:center;}
#bank-inner{width:500px;background:#1a1208;border:2px solid #5a4a2a;border-radius:4px;overflow:hidden;}
#bank-header{background:#0a0500;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a2a1a;}
#bank-header span{color:#c5a028;font-size:14px;font-weight:bold;font-family:monospace;}
#bank-close{color:#ff4444;cursor:pointer;font-size:18px;font-weight:bold;}
#bank-items{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;min-height:160px;}
.bank-slot{width:54px;height:40px;background:#0a0500;border:1px solid #3a2a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:7px;color:#ff981f;text-align:center;}
.bank-slot:hover{border-color:#ff981f;}
.bank-slot .stack-count{position:absolute;bottom:1px;left:2px;font-size:8px;color:#ffff00;font-weight:bold;text-shadow:1px 1px 0 #000;}
#bank-inv{border-top:1px solid #3a2a1a;padding:8px;}
#bank-inv-label{color:#ff981f;font-size:10px;font-family:monospace;margin-bottom:4px;}
#bank-inv-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
#bank-actions{display:flex;gap:4px;padding:4px 8px 8px;justify-content:center;}
.bank-btn{padding:4px 12px;background:#2a1a0a;border:1px solid #5a4a2a;color:#ff981f;font-size:11px;font-family:monospace;cursor:pointer;border-radius:2px;}
.bank-btn:hover{background:#3a2a1a;color:#fff;}
#level-up-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #c5a028;padding:20px 30px;display:none;z-index:200;pointer-events:none;text-align:center;border-radius:4px;}
#level-up-popup h2{color:#ffff00;font-size:16px;margin-bottom:4px;font-family:monospace;}
#level-up-popup p{color:#fff;font-size:13px;font-family:monospace;}
#save-indicator{position:absolute;top:28px;left:8px;color:#3a8a3a;font-size:10px;font-family:monospace;pointer-events:none;opacity:0;transition:opacity 0.5s;z-index:10;}
#tooltip{position:absolute;display:none;background:#1a1208;border:1px solid #5a4a2a;padding:3px 6px;font-size:10px;font-family:monospace;color:#ff981f;z-index:600;pointer-events:none;white-space:nowrap;}
footer{position:fixed;bottom:2px;right:4px;color:#3a2a1a;font-size:9px;font-family:monospace;z-index:0;}
</style>

<script>
(function(){
"use strict";
const W=765,H=503,MAP=60,TICK_MS=600;
const TILE_W=64,TILE_H=32,TILE_DEPTH=16;
let tickCount=0,audioCtx=null,audioStarted=false;

// ---- ISO HELPERS ----
function tileToScreen(gx,gy){return{x:(gx-gy)*(TILE_W/2),y:(gx+gy)*(TILE_H/2)};}
function screenToTile(sx,sy){
const gx=Math.floor((sx/(TILE_W/2)+sy/(TILE_H/2))/2);
const gy=Math.floor((sy/(TILE_H/2)-sx/(TILE_W/2))/2);
return{x:gx,y:gy};
}

let camX=0,camY=0,camTargetX=0,camTargetY=0;
let hoverTile=null;

// ---- ITEMS DB ----
const ITEMS={
coins:{id:'coins',name:'Coins',stackable:true,examine:'Shiny gold pieces.',value:1,color:'#ffd700'},
bones:{id:'bones',name:'Bones',stackable:false,examine:'Them old bones.',value:1,color:'#e8e8d8'},
raw_chicken:{id:'raw_chicken',name:'Raw Chicken',stackable:false,examine:'Raw chicken meat.',value:5,color:'#e8c89a'},
cooked_chicken:{id:'cooked_chicken',name:'Cooked Chicken',stackable:false,examine:'Mmm, chicken.',value:10,color:'#c87840',heals:3},
raw_beef:{id:'raw_beef',name:'Raw Beef',stackable:false,examine:'Raw beef.',value:5,color:'#c87a6a'},
cooked_meat:{id:'cooked_meat',name:'Cooked Meat',stackable:false,examine:'Nicely cooked.',value:10,color:'#8a4a2a',heals:3},
feather:{id:'feather',name:'Feather',stackable:true,examine:'A light feather.',value:1,color:'#f0f0f0'},
egg:{id:'egg',name:'Egg',stackable:false,examine:'A fresh egg.',value:5,color:'#f5e6c8'},
logs:{id:'logs',name:'Logs',stackable:false,examine:'A sturdy log.',value:5,color:'#8a6a3a'},
copper_ore:{id:'copper_ore',name:'Copper Ore',stackable:false,examine:'Copper ore.',value:5,color:'#b87a5a'},
cowhide:{id:'cowhide',name:'Cowhide',stackable:false,examine:'The hide of a cow.',value:25,color:'#c8a87a'},
raw_shrimps:{id:'raw_shrimps',name:'Raw Shrimps',stackable:false,examine:'A raw shrimp.',value:3,color:'#d4b4a4'},
cooked_shrimps:{id:'cooked_shrimps',name:'Cooked Shrimps',stackable:false,examine:'Cooked shrimps.',value:6,color:'#c88060',heals:2},
bucket_milk:{id:'bucket_milk',name:'Bucket of Milk',stackable:false,examine:'A full bucket of milk.',value:10,color:'#f0f0f8'},
pot_flour:{id:'pot_flour',name:'Pot of Flour',stackable:false,examine:'A pot of flour.',value:10,color:'#f5f0e8'},
bronze_sword:{id:'bronze_sword',name:'Bronze Sword',stackable:false,examine:'A bronze sword.',value:50,color:'#c8a068',type:'weapon',slot:'weapon',atkBonus:4,strBonus:4,defBonus:0},
iron_sword:{id:'iron_sword',name:'Iron Sword',stackable:false,examine:'An iron sword.',value:200,color:'#909090',type:'weapon',slot:'weapon',atkBonus:10,strBonus:9,defBonus:0},
iron_dagger:{id:'iron_dagger',name:'Iron Dagger',stackable:false,examine:'A sharp iron dagger.',value:100,color:'#a0a0a0',type:'weapon',slot:'weapon',atkBonus:8,strBonus:5,defBonus:0},
research_notes:{id:'research_notes',name:'Research Notes',stackable:false,examine:'Important arcane research.',value:0,color:'#f5e6c8'},
ghost_skull:{id:'ghost_skull',name:"Ghost's Skull",stackable:false,examine:'A ghostly skull.',value:0,color:'#d8d8c8'},
};

// ---- PLAYER STATE ----
const player={
tile:{x:30,y:30},path:[],target:null,
skills:{attack:{level:1,xp:0},strength:{level:1,xp:0},defence:{level:1,xp:0},hitpoints:{level:10,xp:1154},
prayer:{level:1,xp:0},cooking:{level:1,xp:0},woodcutting:{level:1,xp:0},fishing:{level:1,xp:0},
mining:{level:1,xp:0},firemaking:{level:1,xp:0},crafting:{level:1,xp:0},smithing:{level:1,xp:0}},
currentHp:10,maxHp:10,prayer:1,maxPrayer:1,runEnergy:100,isRunning:false,
inventory:[],equipment:{head:null,body:null,legs:null,weapon:null,shield:null},
gold:25,attackStyle:'accurate',inCombat:false,combatTarget:null,attackCooldown:0,
quests:{feast_assistant:'not_started',arcane_mystery:'not_started',restless_spirit:'not_started'},
questFlags:{milkDone:false,eggDone:false,flourDone:false,notesReceived:false,notesDelivered:false,skullFound:false,skullReturned:false},
respawnTile:{x:30,y:42},deathCount:0,skillingAction:null,skillingTicks:0,
lerpX:30,lerpY:30
};

// ---- XP SYSTEM ----
function xpForLevel(lvl){let p=0;for(let l=1;l<lvl;l++)p+=Math.floor(l+300*Math.pow(2,l/7));return Math.floor(p/4);}
function levelFromXP(xp){for(let l=98;l>=1;l--)if(xp>=xpForLevel(l+1))return l+1;return 1;}
function getTotalLevel(){let t=0;for(let s in player.skills)t+=player.skills[s].level;return t;}

// ---- MAP ----
const TILE_TYPES={GRASS:0,STONE:1,WATER:2,WALL:3,FLOOR:4,DOOR:5,SAND:6,BLOCKED:7,SWAMP:8};
const TILE_WALK=[true,true,false,false,true,true,true,false,true];
const tileMap=new Array(MAP*MAP).fill(0);
const clipFlags=new Array(MAP*MAP).fill(0);
function tIdx(x,y){return y*MAP+x;}
function setTile(x,y,t){if(x>=0&&x<MAP&&y>=0&&y<MAP){tileMap[tIdx(x,y)]=t;clipFlags[tIdx(x,y)]=TILE_WALK[t]?0:1;}}
function getTile(x,y){if(x<0||x>=MAP||y<0||y>=MAP)return TILE_TYPES.BLOCKED;return tileMap[tIdx(x,y)];}
function isWalkable(x,y){if(x<0||x>=MAP||y<0||y>=MAP)return false;return clipFlags[tIdx(x,y)]===0;}

// Tile color palette for iso rendering
const ISO_TILE_COLORS=[
{top:'#4a7c3f',left:'#2d5228',right:'#3a6333'},// GRASS
{top:'#7a7069',left:'#4a4542',right:'#5c5450'},// STONE
{top:'#1a4a8a',left:'#0f2d57',right:'#143a6e'},// WATER
{top:'#6a5a4a',left:'#3d3329',right:'#52432e',raised:true,boxH:28},// WALL
{top:'#8a7a6a',left:'#5c5248',right:'#6e6052'},// FLOOR
{top:'#8a6a3a',left:'#5c4527',right:'#6e5430'},// DOOR

// ---- ISO DRAWING PRIMITIVES ----
function drawIsoTile(cx,sx,sy,topColor,leftColor,rightColor,raised){
const hw=TILE_W/2,hh=TILE_H/2;
const depth=raised?TILE_DEPTH:4;
cx.beginPath();cx.moveTo(sx,sy);cx.lineTo(sx+hw,sy+hh);cx.lineTo(sx,sy+TILE_H);cx.lineTo(sx-hw,sy+hh);cx.closePath();
cx.fillStyle=topColor;cx.fill();
if(raised){
cx.beginPath();cx.moveTo(sx-hw,sy+hh);cx.lineTo(sx,sy+TILE_H);cx.lineTo(sx,sy+TILE_H+depth);cx.lineTo(sx-hw,sy+hh+depth);cx.closePath();
cx.fillStyle=leftColor;cx.fill();
cx.beginPath();cx.moveTo(sx,sy+TILE_H);cx.lineTo(sx+hw,sy+hh);cx.lineTo(sx+hw,sy+hh+depth);cx.lineTo(sx,sy+TILE_H+depth);cx.closePath();
cx.fillStyle=rightColor;cx.fill();
}
}
function drawIsoWall(cx,sx,sy,topColor,leftColor,rightColor,boxH){
const hw=TILE_W/2,hh=TILE_H/2;
const bsy=sy-boxH;
cx.beginPath();cx.moveTo(sx,bsy);cx.lineTo(sx+hw,bsy+hh);cx.lineTo(sx,bsy+TILE_H);cx.lineTo(sx-hw,bsy+hh);cx.closePath();
cx.fillStyle=topColor;cx.fill();
cx.beginPath();cx.moveTo(sx-hw,bsy+hh);cx.lineTo(sx,bsy+TILE_H);cx.lineTo(sx,sy+TILE_H);cx.lineTo(sx-hw,sy+hh);cx.closePath();
cx.fillStyle=leftColor;cx.fill();
cx.beginPath();cx.moveTo(sx,bsy+TILE_H);cx.lineTo(sx+hw,bsy+hh);cx.lineTo(sx+hw,sy+hh);cx.lineTo(sx,sy+TILE_H);cx.closePath();
cx.fillStyle=rightColor;cx.fill();
}

// ---- HITSPLATS & XP DROPS (canvas-based) ----
const hitsplats=[];
const xpDrops=[];
function spawnHitsplat(tx,ty,dmg,miss){hitsplats.push({tx,ty,damage:dmg,isHit:!miss,life:60});}
function spawnXPDrop(skillName,amount){
xpDrops.push({text:'+'+Math.round(amount)+' '+skillName,life:80,tx:player.tile.x,ty:player.tile.y});
}
function drawHitsplats(){
for(let i=hitsplats.length-1;i>=0;i--){
const h=hitsplats[i];h.life--;
if(h.life<=0){hitsplats.splice(i,1);continue;}
const s=tileToScreen(h.tx,h.ty);
const sx=s.x+camX,sy=s.y+camY-(60-h.life)*0.5;
const alpha=Math.min(1,h.life/20);
ctx.save();ctx.globalAlpha=alpha;
ctx.fillStyle=h.isHit?'#cc0000':'#3333cc';
ctx.beginPath();ctx.arc(sx,sy,12,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(h.damage,sx,sy+4);
ctx.restore();
}
}
function drawXPDrops(){
for(let i=xpDrops.length-1;i>=0;i--){
const d=xpDrops[i];d.life--;
if(d.life<=0){xpDrops.splice(i,1);continue;}
const s=tileToScreen(d.tx,d.ty);
const sx=s.x+camX+15,sy=s.y+camY-(80-d.life)*0.5-20;
ctx.save();ctx.globalAlpha=Math.min(1,d.life/20);
ctx.font='bold 11px monospace';ctx.textAlign='center';
ctx.fillStyle='#000';ctx.fillText(d.text,sx+1,sy+1);
ctx.fillStyle='#ffff00';ctx.fillText(d.text,sx,sy);
ctx.restore();
}
}

// ---- A* PATHFINDING ----
function findPath(sx,sy,ex,ey){
if(!isWalkable(ex,ey)){
let best=null,bestD=Infinity;
for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
const nx=ex+dx,ny=ey+dy;
if(isWalkable(nx,ny)){const dd=Math.abs(nx-sx)+Math.abs(ny-sy);if(dd<bestD){bestD=dd;best={x:nx,y:ny};}}
}
if(best){ex=best.x;ey=best.y;}else return[];
}
if(sx===ex&&sy===ey)return[];
const open=[],closed=new Set();
const gS={},fS={},par={};
const k=(x,y)=>x+','+y;
const h=(x,y)=>Math.abs(x-ex)+Math.abs(y-ey);
const sk=k(sx,sy);
gS[sk]=0;fS[sk]=h(sx,sy);
open.push({x:sx,y:sy,f:fS[sk]});
let iters=0;
while(open.length>0&&iters<2000){
iters++;open.sort((a,b)=>a.f-b.f);
const cur=open.shift();const ck=k(cur.x,cur.y);
if(cur.x===ex&&cur.y===ey){
const path=[];let p=ck;
while(p){const[px,py]=p.split(',').map(Number);path.unshift({x:px,y:py});p=par[p];}
return path.slice(1);
}
closed.add(ck);
const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
for(const[ddx,ddy]of dirs){
const nx=cur.x+ddx,ny=cur.y+ddy;const nk=k(nx,ny);
if(closed.has(nk)||!isWalkable(nx,ny))continue;
const ng=(gS[ck]||0)+1;
if(gS[nk]===undefined||ng<gS[nk]){
gS[nk]=ng;fS[nk]=ng+h(nx,ny);par[nk]=ck;
if(!open.some(o=>o.x===nx&&o.y===ny))open.push({x:nx,y:ny,f:fS[nk]});
}
}
}
return[];
}

function addInventoryItem(item){
if(player.inventory.length>=28&&!item.stackable){addChat('Your inventory is full.','game');return false;}
if(item.stackable||item.id==='coins'){
const existing=player.inventory.find(i=>i.id===item.id);
if(existing){existing.qty+=(item.qty||1);updateInventoryPanel();return true;}
}
if(player.inventory.length>=28){addChat('Your inventory is full.','game');return false;}
player.inventory.push({id:item.id,qty:item.qty||1});
updateInventoryPanel();return true;
}
function removeInventoryItem(idx,qty){

item.qty-=qty;if(item.qty<=0)player.inventory.splice(idx,1);
updateInventoryPanel();
}
function hasItem(id){return player.inventory.some(i=>i.id===id);}
function countItem(id){const i=player.inventory.find(x=>x.id===id);return i?i.qty:0;}

function addXP(skill,amount){

player.skills[skill].xp+=amount;
const nl=levelFromXP(player.skills[skill].xp);
if(nl>player.skills[skill].level){player.skills[skill].level=nl;showLevelUp(skill,nl);if(skill==='hitpoints'){player.maxHp=nl;player.currentHp=Math.min(player.currentHp+1,player.maxHp);}playLevelUp();}

// ---- COMBAT ----
function getEffectiveLevel(base,skill){
let bonus=0;
if(player.attackStyle==='accurate'&&skill==='attack')bonus=3;
if(player.attackStyle==='aggressive'&&skill==='strength')bonus=3;
if(player.attackStyle==='defensive'&&skill==='defence')bonus=3;
if(player.attackStyle==='controlled')bonus=1;
return Math.floor(base+bonus+8);
}
function getEquipBonus(type){
let b=0;for(let slot in player.equipment){
const eid=player.equipment[slot];
if(eid){const itm=ITEMS[eid];if(itm){if(type==='atk')b+=(itm.atkBonus||0);if(type==='str')b+=(itm.strBonus||0);if(type==='def')b+=(itm.defBonus||0);}}
}return b;
}
function calcMaxHit(){
const effStr=getEffectiveLevel(player.skills.strength.level,'strength');
const strBonus=getEquipBonus('str');
return Math.max(1,Math.floor(effStr*(strBonus+64)/640+0.5));
}
function calcHitChance(effAtk,atkBonus,effDef,defBonus){
const ar=effAtk*(atkBonus+64),dr=effDef*(defBonus+64);
if(ar>dr)return 1-(dr+2)/(2*(ar+1));return ar/(2*(dr+1));
}
function playerAttackMonster(mon){
const effAtk=getEffectiveLevel(player.skills.attack.level,'attack');
const atkBonus=getEquipBonus('atk');const effDef=Math.floor(mon.level+8);
const hitChance=calcHitChance(effAtk,atkBonus,effDef,0);
if(Math.random()<hitChance){
const maxHit=calcMaxHit();const dmg=Math.floor(Math.random()*(maxHit+1));
if(dmg===0){spawnHitsplat(mon.currentTile.x,mon.currentTile.y,0,true);return;}
mon.currentHp=Math.max(0,mon.currentHp-dmg);
spawnHitsplat(mon.currentTile.x,mon.currentTile.y,dmg,false);
playSwordSwing();
if(player.attackStyle==='accurate')addXP('attack',dmg*4);
else if(player.attackStyle==='aggressive')addXP('strength',dmg*4);
else if(player.attackStyle==='defensive')addXP('defence',dmg*4);
else{addXP('attack',Math.floor(dmg*4/3));addXP('strength',Math.floor(dmg*4/3));addXP('defence',Math.floor(dmg*4/3));}
addXP('hitpoints',Math.floor(dmg*1.33));
if(mon.currentHp<=0)killMonster(mon);
}else{spawnHitsplat(mon.currentTile.x,mon.currentTile.y,0,true);}
}
function monsterAttackPlayer(mon){
const effAtk=Math.floor(mon.level+8);
const effDef=getEffectiveLevel(player.skills.defence.level,'defence');
const defBonus=getEquipBonus('def');
const hitChance=calcHitChance(effAtk,0,effDef,defBonus);
if(Math.random()<hitChance){
const dmg=Math.floor(Math.random()*(mon.maxHit+1));
if(dmg===0){spawnHitsplat(player.tile.x,player.tile.y,0,true);return;}
player.currentHp=Math.max(0,player.currentHp-dmg);
spawnHitsplat(player.tile.x,player.tile.y,dmg,false);
updateOrbs();if(player.currentHp<=0)playerDeath();
}else{spawnHitsplat(player.tile.x,player.tile.y,0,true);}
}
function killMonster(mon){
mon.alive=false;mon.respawnAt=tickCount+50+Math.floor(Math.random()*30);
addChat('You defeated the '+mon.name+'!','combat');
mon.drops.forEach(drop=>{
if(Math.random()<drop.rate){
const qty=Array.isArray(drop.qty)?drop.qty[0]+Math.floor(Math.random()*(drop.qty[1]-drop.qty[0]+1)):drop.qty;
if(drop.id==='coins'){player.gold+=qty;addChat('You received '+qty+' coins.','item');}
else{const def=ITEMS[drop.id];if(def)addInventoryItem({id:drop.id,qty});}
}
});
player.inCombat=false;player.combatTarget=null;
}
function playerDeath(){
addChat('Oh dear, you are dead!','game');
player.inCombat=false;player.combatTarget=null;player.path=[];player.skillingAction=null;
const sorted=[...player.inventory].sort((a,b)=>(ITEMS[b.id]?.value||0)-(ITEMS[a.id]?.value||0));
player.inventory=sorted.slice(0,3);
player.tile={...player.respawnTile};player.lerpX=player.tile.x;player.lerpY=player.tile.y;
player.currentHp=Math.max(3,Math.floor(player.maxHp*0.15));
player.deathCount++;document.getElementById('death-count').textContent=player.deathCount;
updateOrbs();updateInventoryPanel();
addChat('You respawn in Irondale town.','game');
}

// ---- AUDIO ----
function initAudio(){if(audioStarted)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioStarted=true;}catch(e){}}
function playFootstep(){if(!audioCtx)return;try{const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.04,audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/800)*0.15;const src=audioCtx.createBufferSource();src.buffer=buf;const f=audioCtx.createBiquadFilter();f.frequency.value=150;src.connect(f);f.connect(audioCtx.destination);src.start();}catch(e){}}
function playSwordSwing(){if(!audioCtx)return;try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(500,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(80,audioCtx.currentTime+0.12);gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.12);}catch(e){}}
function playLevelUp(){if(!audioCtx)return;try{[261,329,392,523].forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(0.2,audioCtx.currentTime+i*0.1);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+i*0.1+0.18);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+i*0.1);osc.stop(audioCtx.currentTime+i*0.1+0.2);});}catch(e){}}
function playPickup(){if(!audioCtx)return;try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(600,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(1200,audioCtx.currentTime+0.08);gain.gain.setValueAtTime(0.12,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.1);}catch(e){}}

let currentDialog=null;

nodeIdx=nodeIdx||0;

const node=npc.dialog[nodeIdx];if(!node)return;
currentDialog={npcId,nodeIdx};

function handleDialogOption(npcId,opt){
if(opt.next===null){closeDialog();return;}
if(opt.next==='OPEN_BANK'){closeDialog();openBank();return;}
if(opt.next==='BUY_BRONZE'){closeDialog();if(player.gold>=50){player.gold-=50;addInventoryItem({id:'bronze_sword',qty:1});addChat('You bought a Bronze Sword for 50gp.','item');}else addChat("You don't have enough gold.",'game');return;}
if(opt.next==='BUY_IRON'){closeDialog();if(player.gold>=200){player.gold-=200;addInventoryItem({id:'iron_sword',qty:1});addChat('You bought an Iron Sword for 200gp.','item');}else addChat("You don't have enough gold.",'game');return;}
if(opt.next==='GIVE_FLOUR'){closeDialog();if(player.quests.feast_assistant==='in_progress'&&!player.questFlags.flourDone){addInventoryItem({id:'pot_flour',qty:1});player.questFlags.flourDone=true;addChat('You received a pot of flour!','item');playPickup();checkFeastQuest();}else addChat('Millie smiles at you.','game');return;}
if(opt.next==='DELIVER_NOTES'){closeDialog();if(player.quests.arcane_mystery==='in_progress'&&hasItem('research_notes')){const idx=player.inventory.findIndex(i=>i.id==='research_notes');if(idx>=0)removeInventoryItem(idx);player.questFlags.notesDelivered=true;player.quests.arcane_mystery='complete';player.gold+=100;addChat('Quest complete: Arcane Mystery! +100gp','quest');playLevelUp();updateQuestPoints();}else addChat("You don't have any notes for me.",'game');return;}
const npc=NPCS.find(n=>n.id===npcId);
if(npc&&npc.dialog[opt.next])openDialog(npcId,opt.next);else closeDialog();
}

// ---- ITEM INTERACTIONS ----
function useInventoryItem(idx){
const item=player.inventory[idx];if(!item)return;const def=ITEMS[item.id];if(!def)return;
if(def.type==='weapon'){const old=player.equipment.weapon;player.equipment.weapon=item.id;player.inventory.splice(idx,1);if(old)addInventoryItem({id:old,qty:1});addChat('You equip the '+def.name+'.','item');renderPanel();return;}
if(def.heals){if(player.currentHp>=player.maxHp){addChat('You are already at full health.','game');return;}player.currentHp=Math.min(player.maxHp,player.currentHp+def.heals);removeInventoryItem(idx);addChat('You eat the '+def.name+'. It heals '+def.heals+'.','game');updateOrbs();return;}
if(item.id==='bones'){removeInventoryItem(idx);addXP('prayer',5);addChat('You bury the bones.','game');return;}
addChat(def.examine,'game');
}

// ---- SKILLING ----
function startSkilling(action,objRef){player.skillingAction=action;player.skillingTicks=0;player.skillingObj=objRef;player.path=[];player.inCombat=false;player.combatTarget=null;}
function processSkilling(){
if(!player.skillingAction)return;player.skillingTicks++;
const action=player.skillingAction;
if(action==='chop_tree'){
if(player.skillingTicks>=4){player.skillingTicks=0;
if(Math.random()<0.6){if(addInventoryItem({id:'logs',qty:1})){addXP('woodcutting',25);addChat('You get some logs.','game');playPickup();}
if(player.skillingObj){player.skillingObj.alive=false;player.skillingObj.respawnAt=tickCount+50+Math.floor(Math.random()*30);clipFlags[tIdx(player.skillingObj.tile.x,player.skillingObj.tile.y)]=0;}player.skillingAction=null;}}
}else if(action==='fish'){
if(player.skillingTicks>=5){player.skillingTicks=0;if(Math.random()<0.5){if(addInventoryItem({id:'raw_shrimps',qty:1})){addXP('fishing',10);addChat('You catch some shrimps.','game');playPickup();}}if(player.inventory.length>=28)player.skillingAction=null;}
}else if(action==='mine'){
if(player.skillingTicks>=5){player.skillingTicks=0;if(Math.random()<0.5){if(addInventoryItem({id:'copper_ore',qty:1})){addXP('mining',18);addChat('You mine some copper ore.','game');playPickup();}if(player.skillingObj){player.skillingObj.alive=false;player.skillingObj.respawnAt=tickCount+40+Math.floor(Math.random()*20);clipFlags[tIdx(player.skillingObj.tile.x,player.skillingObj.tile.y)]=0;}player.skillingAction=null;}}
}else if(action==='cook'){
if(player.skillingTicks>=3){player.skillingTicks=0;
const rawIdx=player.inventory.findIndex(i=>i.id==='raw_chicken'||i.id==='raw_beef'||i.id==='raw_shrimps');
if(rawIdx>=0){const raw=player.inventory[rawIdx];const burnChance=Math.max(0,(50-player.skills.cooking.level)/100);const cookedMap={raw_chicken:'cooked_chicken',raw_beef:'cooked_meat',raw_shrimps:'cooked_shrimps'};removeInventoryItem(rawIdx);if(Math.random()<burnChance)addChat('You accidentally burn the food.','game');else{const cookedId=cookedMap[raw.id]||'cooked_meat';addInventoryItem({id:cookedId,qty:1});addXP('cooking',30);addChat('You cook the food successfully.','game');}}player.skillingAction=null;}
}
}

// ---- GAME TICK ----
function gameTick(){
tickCount++;
if(player.path.length>0&&!player.inCombat){
const next=player.path[0];
if(isWalkable(next.x,next.y)){
player.tile={...next};player.path.shift();
if(player.isRunning&&player.runEnergy>0&&player.path.length>0){
player.runEnergy=Math.max(0,player.runEnergy-0.6);
const next2=player.path[0];
if(next2&&isWalkable(next2.x,next2.y)){player.tile={...next2};player.path.shift();}
}
playFootstep();
}else{player.path=[];}
}
if(!player.isRunning||player.path.length===0)player.runEnergy=Math.min(100,player.runEnergy+0.3);
if(tickCount%15===0&&player.currentHp<player.maxHp&&!player.inCombat){player.currentHp=Math.min(player.maxHp,player.currentHp+1);updateOrbs();}
if(player.inCombat&&player.combatTarget!==null){
const mon=monsterInstances[player.combatTarget];
if(!mon||!mon.alive){player.inCombat=false;player.combatTarget=null;}
else{
const dist=Math.abs(player.tile.x-mon.currentTile.x)+Math.abs(player.tile.y-mon.currentTile.y);
if(dist>1){const p=findPath(player.tile.x,player.tile.y,mon.currentTile.x,mon.currentTile.y);if(p.length>0){player.tile={...p[0]};if(p.length>1&&player.isRunning)player.tile={...p[1]};}else{player.inCombat=false;player.combatTarget=null;}}
else{player.attackCooldown--;if(player.attackCooldown<=0){playerAttackMonster(mon);player.attackCooldown=4;}mon.atkCooldown--;if(mon.atkCooldown<=0&&mon.alive){monsterAttackPlayer(mon);mon.atkCooldown=mon.atkSpeed;}}
}
}
monsterInstances.forEach(mon=>{
if(!mon.alive){if(tickCount>=mon.respawnAt){mon.alive=true;mon.currentHp=mon.hp;mon.currentTile={...mon.spawnTile};mon.lerpX=mon.spawnTile.x;mon.lerpY=mon.spawnTile.y;}return;}
if(mon.aggressive&&mon.aggroRange>0&&!player.inCombat){const dist=Math.abs(player.tile.x-mon.currentTile.x)+Math.abs(player.tile.y-mon.currentTile.y);if(dist<=mon.aggroRange){player.inCombat=true;player.combatTarget=mon.idx;player.path=[];player.skillingAction=null;player.attackCooldown=1;mon.atkCooldown=1;addChat('The '+mon.name+' attacks you!','combat');}}
if(!mon.target){mon.wanderTimer--;if(mon.wanderTimer<=0){mon.wanderTimer=8+Math.floor(Math.random()*10);const dx=Math.floor(Math.random()*3)-1,dy=Math.floor(Math.random()*3)-1;const nx=mon.currentTile.x+dx,ny=mon.currentTile.y+dy;if(isWalkable(nx,ny)&&Math.abs(nx-mon.spawnTile.x)<5&&Math.abs(ny-mon.spawnTile.y)<5)mon.currentTile={x:nx,y:ny};}}
});
npcInstances.forEach(npc=>{
if(npc.wander>0){npc.wanderTimer--;if(npc.wanderTimer<=0){npc.wanderTimer=10+Math.floor(Math.random()*15);const dx=Math.floor(Math.random()*3)-1,dy=Math.floor(Math.random()*3)-1;const nx=npc.currentTile.x+dx,ny=npc.currentTile.y+dy;if(isWalkable(nx,ny)&&Math.abs(nx-npc.homeTile.x)<=npc.wander&&Math.abs(ny-npc.homeTile.y)<=npc.wander)npc.currentTile={x:nx,y:ny};}}
});
processSkilling();
worldObjects.forEach(obj=>{
if((obj.type==='tree'||obj.type==='rock')&&!obj.alive&&tickCount>=obj.respawnAt){obj.alive=true;clipFlags[tIdx(obj.tile.x,obj.tile.y)]=1;}
if(obj.type==='ground_item'&&obj.taken&&tickCount>=obj.respawnAt){obj.taken=false;}
});
groundItems.forEach(gi=>{if(gi.taken&&tickCount>=gi.respawnAt){gi.taken=false;}});
updateOrbs();
}

// ---- OBJECT CLICK HANDLER ----
function handleObjectClick(obj){
const dist=Math.abs(player.tile.x-obj.tile.x)+Math.abs(player.tile.y-obj.tile.y);
if(dist>2){
player.path=findPath(player.tile.x,player.tile.y,obj.tile.x,obj.tile.y);player.skillingAction=null;
const objRef=obj;const ci=setInterval(()=>{const d2=Math.abs(player.tile.x-objRef.tile.x)+Math.abs(player.tile.y-objRef.tile.y);if(d2<=2){clearInterval(ci);handleObjectInteraction(objRef);}if(player.path.length===0)clearInterval(ci);},300);
return;
}
handleObjectInteraction(obj);
}
function handleObjectInteraction(obj){
if(obj.type==='tree'&&obj.alive){addChat('You begin chopping the tree...','game');startSkilling('chop_tree',obj);}
else if(obj.type==='rock'&&obj.alive){addChat('You begin mining the rock...','game');startSkilling('mine',obj);}
else if(obj.type==='fish'){addChat('You begin fishing...','game');startSkilling('fish',obj);}
else if(obj.type==='range'){const rawIdx=player.inventory.findIndex(i=>i.id==='raw_chicken'||i.id==='raw_beef'||i.id==='raw_shrimps');if(rawIdx>=0){addChat('You begin cooking...','game');startSkilling('cook',obj);}else addChat('You need raw food to cook.','game');}
else if(obj.type==='coffin'){if(player.quests.restless_spirit==='in_progress'&&hasItem('ghost_skull')&&!player.questFlags.skullReturned){const idx=player.inventory.findIndex(i=>i.id==='ghost_skull');if(idx>=0){removeInventoryItem(idx);player.questFlags.skullReturned=true;player.quests.restless_spirit='complete';addXP('prayer',1125);player.gold+=50;addChat('Quest complete: The Restless Spirit! +1125 Prayer XP','quest');playLevelUp();updateQuestPoints();}}else addChat('An old stone coffin.','game');}
else if(obj.type==='ground_item'&&!obj.taken){if(addInventoryItem({id:obj.itemId,qty:obj.qty})){obj.taken=true;obj.respawnAt=tickCount+200;addChat('You pick up: '+ITEMS[obj.itemId].name,'item');playPickup();if(obj.itemId==='ghost_skull')player.questFlags.skullFound=true;}}
else if(obj.type==='dairy'){if(player.quests.feast_assistant==='in_progress'&&!player.questFlags.milkDone){addInventoryItem({id:'bucket_milk',qty:1});player.questFlags.milkDone=true;addChat('You milk the cow into a bucket.','item');playPickup();checkFeastQuest();}else addChat('A dairy cow.','game');}
}
function pickupGroundItem(gi){
const def=ITEMS[gi.id];if(!def)return;
if(gi.id==='coins'){player.gold+=gi.qty;addChat('You pick up '+gi.qty+' coins.','item');}
else{if(!addInventoryItem({id:gi.id,qty:gi.qty}))return;}
gi.taken=true;gi.respawnAt=tickCount+gi.respawn;playPickup();
}

if(bank.isOpen||currentDialog)return;
const rect=canvas.getBoundingClientRect();
const scaleX=W/rect.width,scaleY=H/rect.height;
const mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;

// Check NPCs
for(const npc of npcInstances){
const ns=tileToScreen(npc.lerpX,npc.lerpY);
const nsx=ns.x+camX,nsy=ns.y+camY;
if(Math.abs(mx-nsx)<18&&Math.abs(my-(nsy-6))<28){
player.path=findPath(player.tile.x,player.tile.y,npc.currentTile.x,npc.currentTile.y);

setTimeout(()=>{if(Math.abs(player.tile.x-nRef.currentTile.x)<=1&&Math.abs(player.tile.y-nRef.currentTile.y)<=1)openDialog(nRef.id);},800);
return;
}
}
// Check Monsters
for(const mon of monsterInstances){
if(!mon.alive)continue;
const ms=tileToScreen(mon.lerpX,mon.lerpY);
const msx=ms.x+camX,msy=ms.y+camY;
if(Math.abs(mx-msx)<18&&Math.abs(my-(msy-2))<28){
player.inCombat=true;player.combatTarget=mon.idx;player.path=[];player.skillingAction=null;
player.attackCooldown=1;mon.atkCooldown=mon.atkSpeed;addChat('You attack the '+mon.name+'.','combat');
return;
}
}
// Check world objects
for(const obj of worldObjects){
if(obj.type==='tree'&&!obj.alive)continue;
if(obj.type==='rock'&&!obj.alive)continue;
if(obj.type==='ground_item'&&obj.taken)continue;
const os=tileToScreen(obj.tile.x,obj.tile.y);
const osx=os.x+camX,osy=os.y+camY;
if(Math.abs(mx-osx)<20&&my>osy-30&&my<osy+TILE_H){
handleObjectClick(obj);return;
}
}
// Check ground items
for(const gi of groundItems){
if(gi.taken)continue;
const gs=tileToScreen(gi.tile.x,gi.tile.y);
const gsx=gs.x+camX,gsy=gs.y+camY+TILE_H*0.5;
if(Math.abs(mx-gsx)<12&&Math.abs(my-gsy)<12){
player.path=findPath(player.tile.x,player.tile.y,gi.tile.x,gi.tile.y);
player.skillingAction=null;
const giRef=gi;
setTimeout(()=>{if(player.tile.x===giRef.tile.x&&player.tile.y===giRef.tile.y)pickupGroundItem(giRef);},600);
return;
}
}
// Walk to tile
const t=screenToTile(mx-camX,my-camY-TILE_H/2);
if(t.x>=0&&t.x<MAP&&t.y>=0&&t.y<MAP){
player.path=findPath(player.tile.x,player.tile.y,t.x,t.y);
player.inCombat=false;player.combatTarget=null;player.skillingAction=null;closeDialog();
}
});

camX+=(camTargetX-camX)*0.12;camY+=(camTargetY-camY)*0.12;
}

function render(){
requestAnimationFrame(render);
renderTick++;

// Lerp positions
player.lerpX+=(player.tile.x-player.lerpX)*0.15;
player.lerpY+=(player.tile.y-player.lerpY)*0.15;
npcInstances.forEach(n=>{n.lerpX+=(n.currentTile.x-n.lerpX)*0.1;n.lerpY+=(n.currentTile.y-n.lerpY)*0.1;});
monsterInstances.forEach(m=>{if(m.alive){m.lerpX+=(m.currentTile.x-m.lerpX)*0.1;m.lerpY+=(m.currentTile.y-m.lerpY)*0.1;}});

updateCamera();

ctx.fillStyle='#0a0a05';ctx.fillRect(0,0,W,H);

// Determine visible range
const centerTile=screenToTile(W/2-camX,H/2-camY);
const viewRange=18;
const minX=Math.max(0,centerTile.x-viewRange),maxX=Math.min(MAP-1,centerTile.x+viewRange);
const minY=Math.max(0,centerTile.y-viewRange),maxY=Math.min(MAP-1,centerTile.y+viewRange);

// Build draw list
const drawList=[];

// Tiles
for(let gx=minX;gx<=maxX;gx++){for(let gy=minY;gy<=maxY;gy++){
const t=tileMap[tIdx(gx,gy)];
const s=tileToScreen(gx,gy);
const sx=s.x+camX,sy=s.y+camY;
if(sx<-TILE_W||sx>W+TILE_W||sy<-80||sy>H+60)continue;
drawList.push({sortKey:gx+gy,type:'tile',gx,gy,sx,sy,tileType:t});
}}

// World objects
worldObjects.forEach(obj=>{
if(obj.type==='tree'&&!obj.alive)return;
if(obj.type==='rock'&&!obj.alive)return;
if(obj.type==='ground_item'&&obj.taken)return;
const gx=obj.tile.x,gy=obj.tile.y;
if(gx<minX-2||gx>maxX+2||gy<minY-2||gy>maxY+2)return;
const s=tileToScreen(gx,gy);
drawList.push({sortKey:gx+gy+0.5,type:'object',obj,sx:s.x+camX,sy:s.y+camY});
});

// Ground items
groundItems.forEach(gi=>{
if(gi.taken)return;
const s=tileToScreen(gi.tile.x,gi.tile.y);
drawList.push({sortKey:gi.tile.x+gi.tile.y+0.3,type:'groundItem',gi,sx:s.x+camX,sy:s.y+camY});
});

// NPCs
npcInstances.forEach(npc=>{
const s=tileToScreen(npc.lerpX,npc.lerpY);
drawList.push({sortKey:npc.lerpX+npc.lerpY+0.6,type:'npc',npc,sx:s.x+camX,sy:s.y+camY});
});

// Monsters
monsterInstances.forEach(mon=>{
if(!mon.alive)return;
const s=tileToScreen(mon.lerpX,mon.lerpY);
drawList.push({sortKey:mon.lerpX+mon.lerpY+0.6,type:'monster',mon,sx:s.x+camX,sy:s.y+camY});
});

// Player
const ps=tileToScreen(player.lerpX,player.lerpY);
drawList.push({sortKey:player.lerpX+player.lerpY+0.7,type:'player',sx:ps.x+camX,sy:ps.y+camY});

drawList.sort((a,b)=>a.sortKey-b.sortKey);

// Draw
for(const item of drawList){
switch(item.type){
case 'tile':{
const col=ISO_TILE_COLORS[item.tileType]||ISO_TILE_COLORS[0];
if(item.tileType===TILE_TYPES.WATER){
const bright=0.3+Math.sin(renderTick*0.04+item.gx*0.3)*0.1;
const r=Math.floor(26*bright),g=Math.floor(74*bright),b2=Math.floor(138*bright);
const wTop='rgb('+r+','+g+','+b2+')';
drawIsoTile(ctx,item.sx,item.sy,wTop,col.left,col.right,false);
}else if(col.raised){
drawIsoWall(ctx,item.sx,item.sy,col.top,col.left,col.right,col.boxH||28);
}else{
drawIsoTile(ctx,item.sx,item.sy,col.top,col.left,col.right,false);
}
if(hoverTile&&hoverTile.x===item.gx&&hoverTile.y===item.gy){
ctx.save();ctx.globalAlpha=0.25;drawIsoTile(ctx,item.sx,item.sy,'#ffffff','#cccccc','#dddddd',false);ctx.restore();
}
break;
}
case 'object':{
const o=item.obj;
if(o.type==='tree')drawTree2D(ctx,item.sx,item.sy-4);
else if(o.type==='rock')drawRock2D(ctx,item.sx,item.sy-4);
else if(o.type==='fish')drawFish2D(ctx,item.sx,item.sy-4,renderTick);
else if(o.type==='range')drawRange2D(ctx,item.sx,item.sy);
else if(o.type==='coffin')drawCoffin2D(ctx,item.sx,item.sy);
else if(o.type==='ground_item')drawGroundItemDot(ctx,item.sx,item.sy,ITEMS[o.itemId]?ITEMS[o.itemId].color:'#ddd');
else if(o.type==='dairy')drawDairy2D(ctx,item.sx,item.sy);
break;
}
case 'groundItem':{
const def=ITEMS[item.gi.id];
ctx.fillStyle=def?def.color:'#00ffcc';ctx.beginPath();ctx.arc(item.sx,item.sy+TILE_H*0.5,5,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#00ffff';ctx.font='9px monospace';ctx.textAlign='center';
ctx.fillText(def?def.name.slice(0,6):'?',item.sx,item.sy+TILE_H*0.5-8);
break;
}
case 'npc':{
const n=item.npc;
drawHumanoid2D(ctx,item.sx,item.sy,n.color,'#e8b89a',n.name,null,n.level);
break;
}
case 'monster':{
const m=item.mon;const hpFrac=m.currentHp/m.hp;
if(m.id==='chicken'){drawChicken2D(ctx,item.sx,item.sy);
}else if(m.id==='cow'){drawCow2D(ctx,item.sx,item.sy);
}else{drawHumanoid2D(ctx,item.sx,item.sy,m.color,'#c8a888',null,hpFrac<1?hpFrac:null);}
if(hpFrac<1){const bw=28;ctx.fillStyle='#440000';ctx.fillRect(item.sx-bw/2,item.sy-28,bw,4);ctx.fillStyle=hpFrac>0.5?'#00cc00':hpFrac>0.25?'#cccc00':'#cc0000';ctx.fillRect(item.sx-bw/2,item.sy-28,bw*hpFrac,4);}
ctx.font='10px monospace';ctx.textAlign='center';ctx.fillStyle='#ff6644';ctx.fillText(m.name+(m.level?' (Lv'+m.level+')':''),item.sx,item.sy-32);
break;
}
case 'player':drawPlayer2D(ctx,item.sx,item.sy);break;
}
}

drawHitsplats();
drawXPDrops();
}

// ---- MINIMAP INTERVAL ----
setInterval(renderMinimap,500);
// ---- GAME TICK INTERVAL ----
setInterval(gameTick,TICK_MS);

// ---- LOADING SEQUENCE ----
const loadBar=document.getElementById('load-bar');
const loadStatus=document.getElementById('load-status');
const loadSteps=['Initializing world...','Building Irondale...','Spawning NPCs...','Forging weapons...','Ready!'];
let loadStep=0;
function advanceLoading(){
if(loadStep<loadSteps.length){
loadBar.style.width=(loadStep+1)/loadSteps.length*100+'%';
loadStatus.textContent=loadSteps[loadStep];loadStep++;
if(loadStep<loadSteps.length)setTimeout(advanceLoading,350);
else{setTimeout(()=>{
document.getElementById('loading-screen').style.display='none';
const loaded=loadGame();
if(loaded)addChat('Welcome back to Irondale, adventurer!','game');
else{addChat('Welcome to Irondale! Talk to the Town Guide for help.','game');addChat('Right-click entities for options. Left-click to move/interact.','game');}
renderPanel();renderMinimap();updateOrbs();updateQuestPoints();
},400);}
}
}
setTimeout(advanceLoading,200);

// Start render loop
render();

})();
</script>
</body>
</html>
