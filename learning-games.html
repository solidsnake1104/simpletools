<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sight Word Treasure Hunt</title>
<meta name="theme-color" content="#2BB6A3">
<link rel="manifest" href="data:application/json,{%22name%22:%22Sight%20Word%20Treasure%20Hunt%22,%22display%22:%22standalone%22}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
========================================================= */
:root{
  --ink:#27303A;
  --paper:#FAFAF7;
  --coral:#FF6B5B;
  --teal:#2BB6A3;
  --gold:#FFD166;
  --plum:#6C5CE7;
  --line:#E7E2D6;
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow:0 10px 30px rgba(31,41,51,.10);
  --font-display:'Baloo 2',system-ui,sans-serif;
  --font-body:'Quicksand',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;font-family:var(--font-body);color:var(--ink);
  background:var(--paper);
  overscroll-behavior:none;user-select:none;
  -webkit-user-select:none;
}
#app{
  position:fixed;inset:0;overflow:hidden;
  container-type:size;container-name:stage;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;touch-action:manipulation;}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h1,h2,h3{font-family:var(--font-display);margin:0;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* =========================================================
   HOME (CHILD) — theme picker
========================================================= */
.home-wrap{
  min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:28px;padding:32px 20px 48px;
  background:radial-gradient(circle at 20% 10%,#FFF6E0,#FDE9C8 40%,#FBE0AE 100%);
}
.home-title{
  font-size:clamp(24px,7cqmin,46px);color:var(--coral);text-align:center;
  text-shadow:0 3px 0 #fff, 0 6px 14px rgba(255,107,91,.25);letter-spacing:.5px;
}
.home-chest{width:120px;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18));animation:bob 3.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.mode-toggle{
  display:flex;background:rgba(255,255,255,.7);border-radius:999px;padding:5px;gap:4px;
  box-shadow:var(--shadow);
}
.mode-btn{
  font-family:var(--font-display);font-size:14px;padding:10px 16px;border-radius:999px;
  color:var(--ink);white-space:nowrap;
}
.mode-btn.selected{background:var(--coral);color:#fff;}
.mode-btn:active{transform:scale(.95);}
.theme-grid{
  display:grid;grid-template-columns:repeat(2,minmax(140px,1fr));gap:18px;
  width:100%;max-width:520px;
}
.theme-card{
  border-radius:var(--radius-lg);padding:18px 12px 14px;text-align:center;
  box-shadow:var(--shadow);min-height:140px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  border:4px solid transparent;transition:transform .15s ease;
  font-family:var(--font-display);font-size:20px;color:#fff;
}
.theme-card:active{transform:scale(.94);}
.theme-card .icon{font-size:42px;line-height:1;}
.theme-pirate{background:linear-gradient(160deg,#3FBFB0,#1E8F8C);}
.theme-farm{background:linear-gradient(160deg,#9BD86B,#5FAE3A);}
.theme-space{background:linear-gradient(160deg,#8B7CF6,#4C3CB8);}
.theme-dino{background:linear-gradient(160deg,#FFB259,#FF7A3D);}
.theme-church{background:linear-gradient(160deg,#B8862E,#7B3F61);}
.lock-corner{
  position:absolute;
  top:max(26px, env(safe-area-inset-top));
  right:max(24px, env(safe-area-inset-right));
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:var(--shadow);z-index:50;overflow:hidden;
}
.lock-corner .ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--coral) calc(var(--p,0)*1%), rgba(0,0,0,0) 0);
  -webkit-mask:radial-gradient(closed,transparent 60%,#000 61%);
  mask:radial-gradient(closed,transparent 60%,#000 61%);
  opacity:.9;
}

/* =========================================================
   SCENE (CHILD) — treasure hunt
========================================================= */
.scene{position:absolute;inset:0;}
.scene-bg{position:absolute;inset:0;overflow:hidden;background:#8FE0D6;}
.scene-bg-art{position:absolute;inset:0;z-index:0;}
.scene-bg-art svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.scene-deco{position:absolute;pointer-events:none;}
.scene-topbar{
  position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
  justify-content:space-between;gap:10px;
  padding-top:max(26px, env(safe-area-inset-top));
  padding-right:max(24px, env(safe-area-inset-right));
  padding-bottom:0;
  padding-left:max(24px, env(safe-area-inset-left));
}
.nav-btn{
  width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:24px;
}
.nav-btn:active{transform:scale(.92);}
.meter-wrap{flex:1;max-width:340px;background:rgba(255,255,255,.85);border-radius:999px;
  padding:6px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
.meter-jar{flex:1;height:18px;border-radius:999px;background:#EEE6CC;overflow:hidden;border:2px solid #fff;}
.meter-fill{height:100%;background:linear-gradient(90deg,var(--gold),#FFB347);transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.meter-label{font-family:var(--font-display);font-size:14px;white-space:nowrap;}

.word-tile{
  position:absolute;transform:translate(-50%,-50%) scale(1);
  padding:10px 16px;border-radius:18px;font-family:var(--font-display);
  font-size:clamp(15px,4.4cqmin,22px);letter-spacing:.5px;
  cursor:pointer;transition:transform .18s ease, opacity .18s ease, filter .18s ease;
  display:flex;align-items:center;justify-content:center;min-width:64px;min-height:48px;text-align:center;
  border:3px solid rgba(255,255,255,.5);
}
.word-tile.hidden-word{opacity:.46;filter:saturate(.6) blur(.2px);}
.word-tile.hidden-word:active{transform:translate(-50%,-50%) scale(.92);}
.word-tile.found-word{
  background:#fff !important;color:var(--ink) !important;opacity:1;
  box-shadow:0 8px 20px rgba(0,0,0,.18);border-color:var(--gold);
  animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;
  cursor:default;
}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6) rotate(-6deg)}60%{transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}
.found-star{position:absolute;top:-10px;right:-10px;font-size:18px;animation:pop .5s ease both;}

.confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:40;}
.confetto{position:absolute;width:9px;height:14px;border-radius:3px;animation:confetti-fall 1.1s ease-out forwards;}
@keyframes confetti-fall{
  0%{transform:translate(0,0) rotate(0deg);opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}
}

.celebrate-overlay{
  position:absolute;inset:0;background:rgba(39,48,58,.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:60;
}
.celebrate-card{
  background:#fff;border-radius:32px;padding:34px 28px;text-align:center;max-width:340px;width:88%;
  box-shadow:0 24px 60px rgba(0,0,0,.3);
}
.celebrate-card .big-icon{font-size:64px;display:block;margin-bottom:6px;animation:bob 1.6s ease-in-out infinite;}
.celebrate-title{font-size:28px;color:var(--coral);margin-bottom:6px;}
.celebrate-sub{color:#6B7280;margin-bottom:20px;font-weight:600;}
.celebrate-actions{display:flex;flex-direction:column;gap:10px;}
.btn-primary{
  background:var(--coral);color:#fff;font-family:var(--font-display);font-size:18px;
  padding:14px;border-radius:18px;box-shadow:0 8px 18px rgba(255,107,91,.4);
}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{
  background:#F1EFE8;color:var(--ink);font-family:var(--font-display);font-size:17px;
  padding:13px;border-radius:18px;
}

/* =========================================================
   LISTEN & CHOOSE GAME (CHILD)
========================================================= */
.round-dots-wrap{justify-content:center;gap:8px;padding:10px 16px;}
.round-dot{
  width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.5);
  border:2px solid rgba(0,0,0,.08);flex-shrink:0;
}
.round-dot.done{background:var(--gold);border-color:#E0A93D;}
.round-dot.active{background:var(--coral);border-color:#D9483A;transform:scale(1.25);}

.listen-panel{
  position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:34px;padding:100px 20px 40px;
}
.speaker-btn{
  width:110px;height:110px;border-radius:50%;background:#fff;box-shadow:0 14px 30px rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;border:5px solid var(--gold);
}
.speaker-btn:active{transform:scale(.92);}
.speaker-icon{font-size:48px;}
.speaker-btn.pulse{animation:speakerPulse .6s ease;}
@keyframes speakerPulse{
  0%{box-shadow:0 14px 30px rgba(0,0,0,.22),0 0 0 0 rgba(255,209,102,.6);}
  70%{box-shadow:0 14px 30px rgba(0,0,0,.22),0 0 0 22px rgba(255,209,102,0);}
  100%{box-shadow:0 14px 30px rgba(0,0,0,.22),0 0 0 0 rgba(255,209,102,0);}
}
.choice-grid{
  display:flex;flex-direction:column;gap:16px;width:100%;max-width:380px;
}
.choice-card{
  padding:22px 16px;border-radius:22px;font-family:var(--font-display);
  font-size:clamp(20px,7cqmin,30px);color:#fff;text-align:center;
  box-shadow:var(--shadow);border:4px solid rgba(255,255,255,.5);
  transition:transform .15s ease, opacity .15s ease;
}
.choice-card:active{transform:scale(.96);}
.choice-card:disabled{opacity:.55;}
.choice-card.correct-pick{
  background:#fff !important;color:var(--teal) !important;border-color:var(--teal);
  animation:popLocal .5s cubic-bezier(.34,1.56,.64,1) both;
}
.choice-card.wrong-pick{opacity:.55;}
.choice-card.shake{animation:shakeCard .4s ease;}
@keyframes popLocal{
  0%{transform:scale(.6) rotate(-6deg);}
  60%{transform:scale(1.15) rotate(3deg);}
  100%{transform:scale(1) rotate(0);}
}
@keyframes shakeCard{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
.need-more-wrap{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
}
.need-more-card{
  background:#fff;border-radius:32px;padding:36px 28px;text-align:center;max-width:340px;width:88%;
  box-shadow:0 24px 60px rgba(0,0,0,.25);
}
.need-more-card .big-icon{font-size:56px;display:block;margin-bottom:8px;}

/* =========================================================
   PARENT GATE
========================================================= */
.gate-wrap{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--ink);color:#fff;gap:22px;padding:24px;text-align:center;
}
.gate-circle{
  width:120px;height:120px;border-radius:50%;border:4px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;
}
.gate-circle .progress-ring{
  position:absolute;inset:-4px;border-radius:50%;
  background:conic-gradient(var(--teal) calc(var(--p,0)*1%), rgba(255,255,255,0) 0);
  -webkit-mask:radial-gradient(closed,transparent 70%,#000 71%);
  mask:radial-gradient(closed,transparent 70%,#000 71%);
}
.gate-hint{opacity:.7;font-weight:600;max-width:260px;}

/* =========================================================
   PARENT DASHBOARD
========================================================= */
.pd-wrap{min-height:100%;background:var(--paper);padding-bottom:40px;}
.pd-topbar{
  position:sticky;top:0;background:var(--paper);z-index:20;padding:18px 20px 14px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);
}
.pd-topbar h1{font-size:22px;color:var(--ink);}
.pd-sub{color:#8A8270;font-size:13px;font-weight:600;}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#F1EFE8;display:flex;align-items:center;justify-content:center;font-size:18px;}
.icon-btn:active{transform:scale(.93);}
.pd-content{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.new-set-btn{
  background:var(--teal);color:#fff;font-family:var(--font-display);font-size:16px;
  padding:14px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 18px rgba(43,182,163,.35);
}
.set-card{
  background:#fff;border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow);
  border:2px solid transparent;position:relative;
}
.set-card.active{border-color:var(--gold);}
.set-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.set-card-title{font-family:var(--font-display);font-size:18px;}
.set-card-meta{font-size:12px;color:#9A8F77;font-weight:700;margin-top:2px;}
.active-badge{
  background:var(--gold);color:#7A5B00;font-size:11px;font-weight:800;padding:4px 10px;
  border-radius:999px;font-family:var(--font-body);
}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip{background:#F1EFE8;color:var(--ink);font-size:13px;font-weight:700;padding:5px 10px;border-radius:10px;}
.chip-more{background:transparent;color:#9A8F77;font-size:13px;font-weight:700;padding:5px 2px;}
.set-card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.mini-btn{
  font-size:13px;font-weight:700;padding:9px 12px;border-radius:10px;background:#F1EFE8;color:var(--ink);
}
.mini-btn.act{background:var(--coral);color:#fff;}
.mini-btn.danger{background:#FDEAE7;color:#C0392B;}
.mini-btn:active{transform:scale(.94);}
.empty-state{
  text-align:center;color:#9A8F77;font-weight:600;padding:60px 20px;display:flex;flex-direction:column;
  align-items:center;gap:12px;
}
.voice-card{background:#F5F2E8;}
.voice-select{
  margin-top:10px;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2327303A'><path d='M5.5 7.5l4.5 5 4.5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:40px;
}
.voice-loading{font-size:12px;color:#9A8F77;font-weight:700;margin-top:8px;}

/* =========================================================
   SET EDITOR
========================================================= */
.editor-wrap{min-height:100%;background:var(--paper);}
.editor-content{padding:18px 20px 100px;display:flex;flex-direction:column;gap:18px;}
.field-label{font-size:13px;font-weight:800;color:#8A8270;text-transform:uppercase;letter-spacing:.06em;}
.text-input{
  width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;
  font-family:var(--font-body);font-weight:600;color:var(--ink);background:#fff;
}
.text-input:focus{outline:none;border-color:var(--teal);}
.theme-select-row{display:flex;gap:10px;flex-wrap:wrap;}
.theme-chip{
  padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;border:2px solid var(--line);
  display:flex;align-items:center;gap:6px;color:var(--ink);
}
.theme-chip.selected{border-color:var(--coral);background:#FFF0EE;}
.word-input-row{display:flex;gap:8px;}
.word-input-row .text-input{flex:1;}
.add-word-btn{
  width:54px;border-radius:14px;background:var(--teal);color:#fff;font-size:24px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.add-word-btn:active{transform:scale(.94);}
.editor-chip-wrap{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;}
.editor-chip{
  background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:7px 8px 7px 14px;
  border-radius:999px;display:flex;align-items:center;gap:8px;
}
.editor-chip button{font-size:14px;opacity:.7;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.15);}
.word-count{font-size:12px;font-weight:700;color:#9A8F77;}
.word-count.limit{color:#C0392B;}
.error-msg{font-size:13px;color:#C0392B;font-weight:700;}
.editor-footer{
  position:absolute;bottom:0;left:0;right:0;background:#fff;padding:14px 20px;
  display:flex;gap:10px;box-shadow:0 -8px 24px rgba(0,0,0,.08);
}
.editor-footer button{flex:1;padding:14px;border-radius:14px;font-family:var(--font-display);font-size:16px;}
.editor-footer .cancel{background:#F1EFE8;color:var(--ink);}
.editor-footer .save{background:var(--coral);color:#fff;}

/* =========================================================
   COMPACT LAYOUT — short viewports (phone landscape, or any
   squat window). Measures the #app box itself via container
   queries, so it works whether #app is full-bleed mobile or
   the centered desktop frame.
========================================================= */
@container stage (max-height: 480px){
  /* Home screen: go horizontal, everything sized down, extra side breathing room */
  .home-wrap{
    flex-direction:row;flex-wrap:wrap;align-content:center;
    gap:10px 22px;
    padding-top:14px;padding-bottom:14px;
    padding-left:max(30px, env(safe-area-inset-left));
    padding-right:max(30px, env(safe-area-inset-right));
  }
  .home-chest{width:64px;}
  .home-title{font-size:clamp(18px,5cqmin,26px);line-height:1.05;}
  .mode-toggle{padding:4px;}
  .mode-btn{font-size:12px;padding:7px 10px;}
  .theme-grid{
    grid-template-columns:repeat(5,minmax(64px,1fr));
    gap:8px;max-width:none;flex-basis:100%;
  }
  .theme-card{min-height:76px;padding:8px 6px 6px;font-size:12px;gap:4px;border-width:3px;}
  .theme-card .icon{font-size:24px;}
  .lock-corner{
    width:38px;height:38px;font-size:16px;
    top:max(14px, env(safe-area-inset-top));
    right:max(20px, env(safe-area-inset-right));
  }

  /* Treasure hunt topbar */
  .scene-topbar{
    padding-top:14px;padding-bottom:0;
    padding-left:max(20px, env(safe-area-inset-left));
    padding-right:max(20px, env(safe-area-inset-right));
  }
  .nav-btn{width:40px;height:40px;font-size:18px;}
  .meter-jar{height:14px;}
  .meter-label{font-size:12px;}
  .meter-wrap{padding:4px 10px;}

  /* Listen & Choose: speaker beside choices instead of stacked, extra side padding */
  .listen-panel{
    flex-direction:row;gap:18px;
    padding-top:56px;padding-bottom:14px;
    padding-left:max(30px, env(safe-area-inset-left));
    padding-right:max(30px, env(safe-area-inset-right));
  }
  .speaker-btn{width:70px;height:70px;border-width:3px;flex-shrink:0;}
  .speaker-icon{font-size:30px;}
  .choice-grid{gap:8px;max-width:none;flex:1;}
  .choice-card{padding:12px 10px;border-width:3px;border-radius:16px;}
  .round-dots-wrap{padding:6px 12px;}
  .round-dot{width:10px;height:10px;}

  /* Celebration / empty-state cards: cap height, allow inner scroll */
  .celebrate-card,.need-more-card{
    max-height:88cqh;overflow-y:auto;padding:16px 20px;border-radius:22px;
  }
  .celebrate-card .big-icon,.need-more-card .big-icon{font-size:36px;margin-bottom:2px;}
  .celebrate-title{font-size:20px;margin-bottom:2px;}
  .celebrate-sub{font-size:13px;margin-bottom:10px;}
  .celebrate-actions{gap:6px;}
  .btn-primary,.btn-secondary{padding:10px;font-size:14px;border-radius:14px;}

  /* Parent gate */
  .gate-wrap{
    gap:10px;padding-top:14px;padding-bottom:14px;
    padding-left:max(28px, env(safe-area-inset-left));
    padding-right:max(28px, env(safe-area-inset-right));
  }
  .gate-circle{width:76px;height:76px;font-size:26px;}
  .gate-hint{font-size:13px;}

  /* Parent dashboard / editor: tighten vertical rhythm, extra side padding */
  .pd-topbar{
    padding-top:10px;padding-bottom:8px;
    padding-left:max(24px, env(safe-area-inset-left));
    padding-right:max(24px, env(safe-area-inset-right));
  }
  .pd-topbar h1{font-size:18px;}
  .pd-content{
    padding-top:10px;padding-bottom:10px;gap:10px;
    padding-left:max(24px, env(safe-area-inset-left));
    padding-right:max(24px, env(safe-area-inset-right));

const STORE_KEYS = { sets:'swth_sets', activeId:'swth_active_set', voiceURI:'swth_voice_uri' };

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10); }

/* Fallback words used only if sightwords.txt can't be fetched
   (e.g. opened as a local file:// page without a server, or the
   file 404s). Kept intentionally different-looking from the real
   list so it's obvious in the UI which one loaded. */
const FALLBACK_STARTER_WORDS = ['the','and','you','is','to','a','in','it','of','was'];
const FILE_LOADED_SET_NAME = 'Default Sight Words List';
const FALLBACK_SET_NAME = 'Starter Words (offline fallback)';

function buildDefaultSets(starterWords, starterSetName){
  return [
    { id:'starter', name: starterSetName, theme:'pirate',
      words: starterWords, createdAt: Date.now(), updatedAt: Date.now() },
    { id:'farm1', name:'Farm Theme', theme:'farm',
      words:['cow','pig','barn','hay','sun','run','big','red'],
      createdAt: Date.now(), updatedAt: Date.now() },
    { id:'church1', name:'Sunday School Words', theme:'church',
      words:['pray','god','love','holy','peace','bless','give','good'],
      createdAt: Date.now(), updatedAt: Date.now() }
  ];
}

/* Reads sightwords.txt (comma-separated words, sitting alongside
   index.html) to seed the "Default Sight Words List" set. Logs to
   the console either way so it's easy to confirm from devtools. */
async function fetchStarterWordsFromFile(){
  try{
    const res = await fetch('sightwords.txt', { cache:'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const words = text.split(',').map(w=>normalizeWord(w)).filter(Boolean);
    const unique = Array.from(new Set(words)); // de-dupe, preserve order
    if(!unique.length) throw new Error('file loaded but contained no valid words');
    console.info('[Sight Word Treasure Hunt] Loaded', unique.length, 'words from sightwords.txt');
    return unique;
  }catch(e){
    console.warn('[Sight Word Treasure Hunt] Could not load sightwords.txt (' + e.message + '). Using built-in fallback words instead.');
    return null;
  }
}

function loadSets(){
  try{
    const raw = localStorage.getItem(STORE_KEYS.sets);
    if(!raw){ const d = buildDefaultSets(FALLBACK_STARTER_WORDS, FALLBACK_SET_NAME); saveSets(d); return d; }
    return JSON.parse(raw);
  }catch(e){ return buildDefaultSets(FALLBACK_STARTER_WORDS, FALLBACK_SET_NAME); }
}
function saveSets(sets){ localStorage.setItem(STORE_KEYS.sets, JSON.stringify(sets)); }

function loadActiveId(){
  return localStorage.getItem(STORE_KEYS.activeId) || (loadSets()[0] && loadSets()[0].id) || null;
}
function saveActiveId(id){ localStorage.setItem(STORE_KEYS.activeId, id); }

/* Validation rules: lowercase, trim, dedupe, no empty. No word-count limit. */
function normalizeWord(w){ return String(w||'').trim().toLowerCase().replace(/[^a-z']/g,''); }
function validateWordList(words){
  const errors = [];
  const seen = new Set();
  const clean = [];
  words.forEach(raw=>{
    const w = normalizeWord(raw);
    if(!w) return;
    if(seen.has(w)) return;
    seen.add(w);
    clean.push(w);
  });
  if(clean.length === 0) errors.push('Add at least one word.');
  return { clean, errors };
}

/* Long-press gesture on lock icon to enter parent area (kid-proofing) */
function attachLockButton(){
  const btn = document.getElementById('lockBtn');
  if(!btn) return;
  let raf, start;
  const ring = document.getElementById('lockRing');
  const HOLD_MS = 1200;
  function step(ts){
    if(!start) start = ts;
    const pct = Math.min(100, ((ts-start)/HOLD_MS)*100);
    if(ring) ring.style.setProperty('--p', pct);
    if(pct >= 100){ cancelAnimationFrame(raf); state.view='gate'; state.gateProgress=0; render(); return; }
    raf = requestAnimationFrame(step);
  }
  function startHold(e){ e.preventDefault(); start=null; raf = requestAnimationFrame(step); }
  function endHold(){ cancelAnimationFrame(raf); if(ring) ring.style.setProperty('--p',0); }
  btn.addEventListener('pointerdown', startHold);
  btn.addEventListener('pointerup', endHold);
  btn.addEventListener('pointerleave', endHold);
  btn.addEventListener('pointercancel', endHold);
}

function getActiveSet(){
  const sets = loadSets();
  const activeId = loadActiveId();
  return sets.find(s=>s.id===activeId) || sets[0];
}

function goScene(themeKeyOverride){
  const set = getActiveSet();
  state.themeKey = themeKeyOverride || set.theme || 'pirate';
  const variants = THEME_BACKGROUNDS[state.themeKey] || THEME_BACKGROUNDS.pirate;
  state.bgVariantIndex = Math.floor(Math.random() * variants.length);
  const allWords = set ? set.words.slice() : [];
  shuffle(allWords);
  state.remainingQueue = allWords;
  state.totalCount = allWords.length;
  state.foundCount = 0;
  loadNextBatch();
  state.view = 'scene';
  render();
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function loadNextBatch(){
  const batch = state.remainingQueue.splice(0, BATCH_SIZE);
  const slots = shuffle(BASE_SLOTS.slice()).slice(0, batch.length);
  state.sceneWords = batch.map((w,i)=>({
    id: uid(), word: w, found:false,
    x: jitter(slots[i].x), y: jitter(slots[i].y)
  }));
}

function renderScene(){
  const theme = THEMES[state.themeKey];
  const decoHtml = theme.deco.map(d=>`
    <span class="scene-deco" style="top:${d.top};left:${d.left};font-size:${d.size}px;">${d.emoji}</span>
  `).join('');

  const wordsHtml = state.sceneWords.map((w,i)=>{
    const color = theme.tileColors[i % theme.tileColors.length];
    const style = `top:${w.y}%; left:${w.x}%; background:${w.found?'#fff':color};`;
    return `
      <button class="word-tile ${w.found?'found-word':'hidden-word'}"
        style="${style}" data-id="${w.id}"
        onclick="tapWord('${w.id}', event)" ${w.found?'tabindex="-1"':''}>
        ${escapeHtml(w.word)}
        ${w.found?'<span class="found-star">⭐</span>':''}
      </button>
    `;
  }).join('');

  const pct = state.totalCount ? Math.round((state.foundCount/state.totalCount)*100) : 0;
  const bgVariants = THEME_BACKGROUNDS[state.themeKey] || THEME_BACKGROUNDS.pirate;
  const bgSvg = bgVariants[state.bgVariantIndex] || bgVariants[0];

  app.innerHTML = `
    <div class="screen fade-in">
      <div class="scene">
        <div class="scene-bg">
          <div class="scene-bg-art">${bgSvg}</div>
          ${decoHtml}
          ${wordsHtml}
        </div>
        <div class="confetti-layer" id="confettiLayer"></div>
        <div class="scene-topbar">
          <button class="nav-btn" onclick="goView('home')" aria-label="Home">🏠</button>
          <div class="meter-wrap">
            <div class="meter-jar"><div class="meter-fill" style="width:${pct}%"></div></div>
            <span class="meter-label">${state.foundCount}/${state.totalCount} 🏆</span>
          </div>
          <button class="nav-btn" onclick="goView('home')" aria-label="Back">↩️</button>
        </div>
      </div>
    </div>
  `;
}

function tapWord(id, evt){
  const w = state.sceneWords.find(x=>x.id===id);
  if(!w || w.found) return;
  w.found = true;
  state.foundCount++;
  render();
  // confetti burst near tap location
  requestAnimationFrame(()=>{
    const layer = document.getElementById('confettiLayer');
    const el = document.querySelector(`[data-id="${id}"]`);
    if(layer && el){
      const r = el.getBoundingClientRect();
      spawnConfetti(layer, r.left + r.width/2, r.top + r.height/2);
    }
  });

  const allFoundInBatch = state.sceneWords.every(x=>x.found);
  if(allFoundInBatch){
    setTimeout(()=>{
      if(state.remainingQueue.length > 0){
        showBatchComplete();
      } else {
        showHuntComplete();
      }
    }, 550);
  }
}

function spawnConfetti(layer, x, y){
  const colors = ['#FF6B5B','#2BB6A3','#FFD166','#6C5CE7','#FF9F1C'];
  for(let i=0;i<18;i++){
    const p = document.createElement('div');
    p.className = 'confetto';
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*90;
    p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--dy', (Math.sin(angle)*dist - 40) + 'px');
    p.style.setProperty('--rot', (Math.random()*360-180)+'deg');
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    layer.appendChild(p);
    setTimeout(()=>p.remove(), 1200);
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   CHILD: LISTEN & CHOOSE (text-to-speech word matching)
========================================================= */

/* By default we use the browser/OS's own default voice (whatever
   the person hears from any other speaking website). A parent can
   optionally pick a specific installed voice from Parent Settings;
   that choice is remembered in localStorage. */
let availableVoices = [];

function refreshVoiceList(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if(voices && voices.length){
    availableVoices = voices;
    // If the voice list finishes loading while the parent is looking
    // at the dashboard, refresh the picker so it isn't stuck empty.
    if(state.view === 'dashboard') renderDashboard();
  }
}

function initVoices(){
  if(!('speechSynthesis' in window)) return;
  refreshVoiceList();
  window.speechSynthesis.onvoiceschanged = refreshVoiceList;
}

/* Known lower-quality/legacy voices to exclude, and known
   natural-sounding voices to surface first, when narrowing the
   parent's voice picker down to American English only. */
const US_VOICE_LOW_QUALITY_HINTS = ['compact','espeak','microsoft david','microsoft mark','microsoft zira'];
const US_VOICE_QUALITY_HINTS = [
  'google us english','samantha','ava','allison','zoe','nicky','evan','susan','tom','aaron',
  'natural','enhanced','premium','neural'
];

function getUsEnglishVoices(){
  const enUS = availableVoices.filter(v => /^en[-_]us$/i.test(v.lang || ''));
  const highQuality = enUS.filter(v =>
    !US_VOICE_LOW_QUALITY_HINTS.some(h => v.name.toLowerCase().includes(h))
  );
  const pool = highQuality.length ? highQuality : enUS; // never show an empty list if filtering removes everything
  return pool.slice().sort((a,b)=>{
    const aTop = US_VOICE_QUALITY_HINTS.some(h => a.name.toLowerCase().includes(h)) ? 0 : 1;
    const bTop = US_VOICE_QUALITY_HINTS.some(h => b.name.toLowerCase().includes(h)) ? 0 : 1;
    if(aTop !== bTop) return aTop - bTop;
    return a.name.localeCompare(b.name);
  });
}

function loadVoicePref(){ return localStorage.getItem(STORE_KEYS.voiceURI) || ''; }
function saveVoicePref(uri){
  if(uri){ localStorage.setItem(STORE_KEYS.voiceURI, uri); }
  else { localStorage.removeItem(STORE_KEYS.voiceURI); }
}

function stopSpeech(){
  if('speechSynthesis' in window){ window.speechSynthesis.cancel(); }
}

function speakWord(word){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  const prefUri = loadVoicePref();
  if(prefUri){
    const match = availableVoices.find(v=>v.voiceURI === prefUri);
    if(match){ utter.voice = match; utter.lang = match.lang; }
  }
  // otherwise: leave utter.voice unset so the browser uses its own default
  utter.rate = 0.85;
  utter.pitch = 1.05;
  window.speechSynthesis.speak(utter);
}

function onVoiceSelectChange(uri){
  saveVoicePref(uri);
  speakWord('sight word');
}

function buildListenRounds(words, count){
  const rounds = [];
  const pool = shuffle(words.slice());
  for(let i=0;i<count;i++){
    const target = pool[i % pool.length];
    const others = words.filter(w=>w!==target);
    const distractors = shuffle(others.slice()).slice(0,2);
    const choices = shuffle([target, ...distractors]);
    rounds.push({ target, choices });
  }
  return rounds;
}

function goListenGame(themeKeyOverride){
  const set = getActiveSet();
  const words = set ? Array.from(new Set(set.words)) : [];
  state.themeKey = themeKeyOverride || (set && set.theme) || 'pirate';

  if(words.length < 3){
    state.view = 'listen';
    state.listenRounds = [];
    render();
    return;
  }

  const variants = THEME_BACKGROUNDS[state.themeKey] || THEME_BACKGROUNDS.pirate;
  state.bgVariantIndex = Math.floor(Math.random() * variants.length);
  state.listenRounds = buildListenRounds(words, LISTEN_ROUND_COUNT);
  state.listenIndex = 0;
  state.listenResults = [];
  state.listenWrongPick = null;
  state.view = 'listen';
  render();
}

function renderListenGame(){
  const theme = THEMES[state.themeKey];
  const bgVariants = THEME_BACKGROUNDS[state.themeKey] || THEME_BACKGROUNDS.pirate;
  const bgSvg = bgVariants[state.bgVariantIndex] || bgVariants[0];

  if(!state.listenRounds || state.listenRounds.length === 0){
    app.innerHTML = `
      <div class="screen fade-in">
        <div class="scene">
          <div class="scene-bg"><div class="scene-bg-art">${bgSvg}</div></div>
          <div class="scene-topbar">
            <button class="nav-btn" onclick="goView('home')" aria-label="Home">🏠</button>
            <span></span>
            <span style="width:54px"></span>
          </div>
          <div class="need-more-wrap">
            <div class="need-more-card">
              <span class="big-icon">🎧</span>
              <div class="celebrate-title">Need More Words</div>
              <div class="celebrate-sub">This word set needs at least 3 words to play. Add more in Parent Settings.</div>
              <button class="btn-primary" onclick="goView('home')">Back to Map</button>
            </div>
          </div>
        </div>
      </div>
    `;
    return;
  }

  const round = state.listenRounds[state.listenIndex];
  const dots = state.listenRounds.map((r,i)=>{
    let cls = 'round-dot';
    if(i < state.listenIndex) cls += ' done';
    else if(i === state.listenIndex) cls += ' active';
    return `<span class="${cls}"></span>`;
  }).join('');

  const choicesHtml = round.choices.map((w,i)=>{
    const color = theme.tileColors[i % theme.tileColors.length];
    let extra = '';
    if(state.listenWrongPick === w) extra = ' wrong-pick';
    return `
      <button class="choice-card${extra}" style="background:${color};" onclick="pickListenAnswer('${w}')" data-word="${w}">
        ${escapeHtml(w)}
      </button>
    `;
  }).join('');

  app.innerHTML = `
    <div class="screen fade-in">
      <div class="scene">
        <div class="scene-bg"><div class="scene-bg-art">${bgSvg}</div></div>
        <div class="confetti-layer" id="confettiLayer"></div>
        <div class="scene-topbar">
          <button class="nav-btn" onclick="goView('home')" aria-label="Home">🏠</button>
          <div class="meter-wrap round-dots-wrap">${dots}</div>
          <button class="nav-btn" onclick="goView('home')" aria-label="Back">↩️</button>
        </div>
        <div class="listen-panel">
          <button class="speaker-btn" id="speakerBtn" onclick="playCurrentWord()" aria-label="Play word">
            <span class="speaker-icon">🔊</span>
          </button>
          <div class="choice-grid">${choicesHtml}</div>
        </div>
      </div>
    </div>
  `;

  setTimeout(()=>{ playCurrentWord(); }, 450);
}

function playCurrentWord(){
  const round = state.listenRounds[state.listenIndex];
  if(!round) return;
  speakWord(round.target);
  const btn = document.getElementById('speakerBtn');
  if(btn){
    btn.classList.remove('pulse');
    void btn.offsetWidth;
    btn.classList.add('pulse');
  }
}

function pickListenAnswer(word){
  const round = state.listenRounds[state.listenIndex];
  if(!round) return;
  const cardEl = document.querySelector(`.choice-card[data-word="${cssEscape(word)}"]`);

  if(word === round.target){
    state.listenWrongPick = null;
    state.listenResults[state.listenIndex] = 'correct';
    if(cardEl){
      cardEl.classList.add('correct-pick');
      const r = cardEl.getBoundingClientRect();
      const layer = document.getElementById('confettiLayer');
      if(layer) spawnConfetti(layer, r.left + r.width/2, r.top + r.height/2);
    }
    document.querySelectorAll('.choice-card').forEach(el=>{ if(el!==cardEl) el.disabled = true; });
    setTimeout(()=>{
      if(state.listenIndex < state.listenRounds.length - 1){
        state.listenIndex++;
        state.listenWrongPick = null;
        renderListenGame();
      } else {
        showListenComplete();
      }
    }, 750);
  } else {
    state.listenWrongPick = word;
    if(cardEl){
      cardEl.classList.remove('shake');
      void cardEl.offsetWidth;
      cardEl.classList.add('shake','wrong-pick');
    }
    setTimeout(()=>{ playCurrentWord(); }, 550);
  }
}

function cssEscape(s){ return String(s).replace(/["\\]/g,'\\$&'); }

function showListenComplete(){
  const overlay = document.createElement('div');
  overlay.className = 'celebrate-overlay fade-in';
  overlay.innerHTML = `
    <div class="celebrate-card">
      <span class="big-icon">🎧</span>
      <div class="celebrate-title">Great Listening!</div>
      <div class="celebrate-sub">You matched all ${state.listenRounds.length} words!</div>
      <div class="celebrate-actions">
        <button class="btn-primary" onclick="goListenGame(state.themeKey)">Play Again</button>
        <button class="btn-secondary" onclick="goView('home')">Back to Map</button>
      </div>
    </div>
  `;
  document.querySelector('.scene').appendChild(overlay);
}

function renderDashboard(){

  const currentVoiceUri = loadVoicePref();

  const usVoices = getUsEnglishVoices();

    const more = s.words.length > 6 ? `<span class="chip-more">+${s.words.length-6} more</span>` : '';
    const theme = THEMES[s.theme] || THEMES.pirate;
    const fromFileNote = s.id === 'starter' && s.name === FILE_LOADED_SET_NAME
      ? ' · 📄 loaded from sightwords.txt' : '';
    return `
      <div class="set-card ${isActive?'active':''}">
        <div class="set-card-head">
          <div>
            <div class="set-card-title">${theme.icon} ${escapeHtml(s.name)}</div>
            <div class="set-card-meta">${s.words.length} word${s.words.length===1?'':'s'} · ${theme.label}${fromFileNote}</div>
          </div>
          ${isActive ? '<span class="active-badge">ACTIVE</span>' : ''}
        </div>
        <div class="chip-row">${preview}${more}</div>
        <div class="set-card-actions">
          ${isActive ? '' : `<button class="mini-btn act" onclick="activateSet('${s.id}')">Activate</button>`}
          <button class="mini-btn" onclick="openEditor('${s.id}')">Edit</button>
          <button class="mini-btn" onclick="duplicateSet('${s.id}')">Duplicate</button>
          <button class="mini-btn danger" onclick="deleteSet('${s.id}')">Delete</button>
        </div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="screen fade-in">
      <div class="pd-wrap">
        <div class="pd-topbar">
          <div>
            <h1>Word Set Manager</h1>
            <div class="pd-sub">Parent Dashboard</div>
          </div>
          <button class="icon-btn" onclick="goView('home')" aria-label="Exit to child view">✕</button>
        </div>
        <div class="pd-content">
          ${voiceCard}
          <button class="new-set-btn" onclick="openEditor(null)">＋ New Set</button>
          ${cards}
        </div>
      </div>
    </div>
  `;
}

function activateSet(id){ saveActiveId(id); renderDashboard(); }

function duplicateSet(id){
  const sets = loadSets();
  const s = sets.find(x=>x.id===id);
  if(!s) return;
  const copy = { ...s, id: uid(), name: s.name + ' (Copy)', createdAt: Date.now(), updatedAt: Date.now() };
  sets.push(copy);
  saveSets(sets);
  renderDashboard();
}

function deleteSet(id){
  const sets = loadSets();
  if(sets.length <= 1){ alert('You need at least one word set.'); return; }
  if(!confirm('Delete this word set? This cannot be undone.')) return;
  const next = sets.filter(s=>s.id!==id);
  saveSets(next);
  if(loadActiveId() === id){ saveActiveId(next[0].id); }
  renderDashboard();
}

/* =========================================================
   SET EDITOR
========================================================= */
function openEditor(id){
  const sets = loadSets();
  const existing = id ? sets.find(s=>s.id===id) : null;
  state.editingSetId = id;
  state.editorDraft = existing
    ? { name: existing.name, theme: existing.theme, words: existing.words.slice() }
    : { name: '', theme: 'pirate', words: [] };
  state.view = 'editor';
  render();
}

function renderEditor(){
  const d = state.editorDraft;
  const themeChips = Object.entries(THEMES).map(([key,t])=>`
    <button class="theme-chip ${d.theme===key?'selected':''}" onclick="setEditorTheme('${key}')">${t.icon} ${t.label}</button>
  `).join('');
  const chips = d.words.map((w,i)=>`
    <span class="editor-chip">${escapeHtml(w)}<button onclick="removeEditorWord(${i})" aria-label="Remove ${escapeHtml(w)}">✕</button></span>
  `).join('');

  app.innerHTML = `
    <div class="screen fade-in">
      <div class="editor-wrap">
        <div class="pd-topbar">
          <h1>${state.editingSetId ? 'Edit Set' : 'New Set'}</h1>
          <button class="icon-btn" onclick="state.view='dashboard';render();" aria-label="Close">✕</button>
        </div>
        <div class="editor-content">
          <div>
            <div class="field-label">Set Name</div>
            <input class="text-input" id="setNameInput" placeholder="e.g. Week 2 Words" value="${escapeHtml(d.name)}" oninput="d_setName(this.value)">
          </div>
          <div>
            <div class="field-label">Scene Theme</div>
            <div class="theme-select-row">${themeChips}</div>
          </div>
          <div>
            <div class="field-label">Sight Words</div>
            <div class="word-input-row">
              <input class="text-input" id="wordInput" placeholder="Type a word, then press Add"
                onkeydown="if(event.key==='Enter'){event.preventDefault();addEditorWord();}">
              <button class="add-word-btn" onclick="addEditorWord()" aria-label="Add word">+</button>
            </div>
            <div style="height:10px"></div>
            <div class="editor-chip-wrap">${chips}</div>
            <div style="height:6px"></div>
            <div class="word-count">${d.words.length} word${d.words.length===1?'':'s'}</div>
          </div>
          <div id="editorError"></div>
        </div>
        <div class="editor-footer">
          <button class="cancel" onclick="state.view='dashboard';render();">Cancel</button>
          <button class="save" onclick="saveEditor()">Save Set</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('wordInput').focus();
}

function d_setName(v){ state.editorDraft.name = v; }
function setEditorTheme(key){ state.editorDraft.theme = key; renderEditor(); }

function addEditorWord(){
  const input = document.getElementById('wordInput');
  const raw = input.value;
  if(!raw.trim()) return;
  // allow comma/space separated batch entry
  const pieces = raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  pieces.forEach(p=>{
    const w = normalizeWord(p);
    if(w && !state.editorDraft.words.includes(w)){
      state.editorDraft.words.push(w);
    }
  });
  input.value = '';
  renderEditor();
}
function removeEditorWord(i){
  state.editorDraft.words.splice(i,1);
  renderEditor();
}

function saveEditor(){
  const d = state.editorDraft;
  const name = d.name.trim() || 'Untitled Set';
  const { clean, errors } = validateWordList(d.words);
  if(errors.length){
    document.getElementById('editorError').innerHTML = `<div class="error-msg">${errors.map(escapeHtml).join('<br/>')}</div>`;
    return;
  }
  const sets = loadSets();
  if(state.editingSetId){
    const idx = sets.findIndex(s=>s.id===state.editingSetId);
    sets[idx] = { ...sets[idx], name, theme:d.theme, words:clean, updatedAt: Date.now() };
  } else {
    const newSet = { id: uid(), name, theme:d.theme, words:clean, createdAt: Date.now(), updatedAt: Date.now() };
    sets.push(newSet);
    if(!loadActiveId()) saveActiveId(newSet.id);
  }
  saveSets(sets);
  state.view = 'dashboard';
  render();
}

/* =========================================================
   FORGIVING TAP DETECTION
   Young children rarely lift their finger from the exact spot
   they touched down on. A native browser "click" only fires when
   the touch STARTS and ENDS on the same element, so a small drag
   can silently fail to register. This listens for the gap: if a
   touch/pointer lifts a short distance away from where it started
   and doesn't land on another tappable element, we still fire the
   original button's click.
========================================================= */
(function setupForgivingTaps(){
  const TAP_TOLERANCE_PX = 28;
  let downTarget = null, downX = 0, downY = 0;

  function findTappable(el){
    return (el && el.closest) ? el.closest('button:not(:disabled)') : null;
  }

  document.addEventListener('pointerdown', (e)=>{
    downTarget = findTappable(e.target);
    downX = e.clientX; downY = e.clientY;
  }, true);

  document.addEventListener('pointerup', (e)=>{
    if(!downTarget) return;
    const liftTarget = findTappable(e.target);
    if(liftTarget === downTarget){ downTarget = null; return; } // native click already handles this
    if(liftTarget){ downTarget = null; return; } // finger drifted onto a different button - don't guess
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if(Math.sqrt(dx*dx + dy*dy) <= TAP_TOLERANCE_PX){
      e.preventDefault();
      downTarget.click();
    }
    downTarget = null;
  }, true);

  document.addEventListener('pointercancel', ()=>{ downTarget = null; }, true);
})();

/* =========================================================
   INIT + SERVICE WORKER (offline support)
========================================================= */
async function initApp(){
  if(!localStorage.getItem(STORE_KEYS.sets)){
    // Brand new install: seed from sightwords.txt if we can reach it,
    // otherwise fall back to the small built-in list.
    const fileWords = await fetchStarterWordsFromFile();
    const usingFile = !!fileWords;
    saveSets(buildDefaultSets(
      usingFile ? fileWords : FALLBACK_STARTER_WORDS,
      usingFile ? FILE_LOADED_SET_NAME : FALLBACK_SET_NAME
    ));
  } else {
    // Sets already exist from a previous run. If the starter set is
    // still on the offline fallback list (sightwords.txt wasn't
    // reachable last time), try again now and upgrade it in place -
    // this never touches sets a parent has renamed or edited.
    const sets = loadSets();
    const starter = sets.find(s => s.id === 'starter');
    if(starter && (starter.name === FALLBACK_SET_NAME || starter.name === 'Starter Words')){
      const fileWords = await fetchStarterWordsFromFile();
      if(fileWords){
        starter.name = FILE_LOADED_SET_NAME;
        starter.words = fileWords;
        starter.updatedAt = Date.now();
        saveSets(sets);
      }
    }
  }
  if(!localStorage.getItem(STORE_KEYS.activeId)){
    const sets = loadSets();
    if(sets[0]) saveActiveId(sets[0].id);
  }
  initVoices();
  render();
}
initApp();

if('serviceWorker' in navigator){
  const swCode = `
    const CACHE='swth-v1';
    self.addEventListener('install', e=>{ self.skipWaiting(); });
    self.addEventListener('activate', e=>{ self.clients.claim(); });
    self.addEventListener('fetch', e=>{
      e.respondWith(
        caches.open(CACHE).then(async cache=>{
          const cached = await cache.match(e.request);
          if(cached) return cached;
          try{
            const res = await fetch(e.request);
            if(e.request.method==='GET') cache.put(e.request, res.clone());
            return res;
          }catch(err){ return cached || Response.error(); }
        })
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
